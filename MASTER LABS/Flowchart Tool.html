  let _pdfBgPngCache = null;
  function loadPdfBgPng(pxW, pxH) {
    return new Promise((resolve, reject) => {
      if (_pdfBgPngCache) { resolve(_pdfBgPngCache); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = pxW; canvas.height = pxH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, pxW, pxH);
        _pdfBgPngCache = canvas.toDataURL('image/png');
        resolve(_pdfBgPngCache);
      };
      img.onerror = reject;
      img.src = PDF_BG_SVG_DATAURL;
    });
  }

  async function generateFlowchartPDF(name, id, grade, triggerBtn) {
    const originalLabel = triggerBtn ? triggerBtn.textContent : '';
    if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = 'Generating PDF\u2026'; }
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
      const margin = 48;

      const bgPng = await loadPdfBgPng(Math.round(pageW * 2), Math.round(pageH * 2));
      const drawBg = () => doc.addImage(bgPng, 'PNG', 0, 0, pageW, pageH);
      drawBg();

      const labTitle = (weekData && (weekData.flowchartTitle || weekData.title)) || 'Cybersecurity Flowchart Builder Lab';
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(18, 26, 43);
      doc.text(labTitle, margin, 62, { maxWidth: pageW - margin * 2 });

      doc.setDrawColor(255, 159, 28); doc.setLineWidth(1.5);
      doc.line(margin, 80, pageW - margin, 80);

      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString();

      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(90, 100, 120);
      doc.text('Date: ' + dateStr, margin, 102);
      doc.text('Time: ' + timeStr, pageW - margin, 102, { align: 'right' });

      doc.setDrawColor(210, 210, 210); doc.setLineWidth(0.75);
      doc.roundedRect(margin, 118, pageW - margin * 2, 64, 6, 6);

      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30, 40, 60);
      doc.text('STUDENT NAME:', margin + 16, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(name || '', margin + 112, 140, { maxWidth: 185 });
      doc.setFont('helvetica', 'bold');
      doc.text('ID:', margin + 300, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(id || '', margin + 322, 140, { maxWidth: 48 });
      doc.setFont('helvetica', 'bold');
      doc.text('GRADE:', margin + 372, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(grade || '', margin + 426, 140, { maxWidth: 73 });

      const totalSteps = weekData ? weekData.steps.length : 0;
      const isComplete = !!(weekData && stepIndex >= totalSteps);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
      if (isComplete) {
        doc.setTextColor(20, 140, 110);
        doc.text('Flowchart: Completed', margin + 16, 166);
      } else {
        doc.setTextColor(160, 70, 70);
        doc.text('Flowchart: In Progress (' + stepIndex + ' / ' + totalSteps + ' steps)', margin + 16, 166);
      }
      if (currentWeekKey) { doc.setTextColor(20, 140, 110); doc.text('Week: ' + currentWeekKey, margin + 300, 166); }

      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(18, 26, 43);
      doc.text('Algorithm Introduction', margin, 212);

      const introText = (weekData && weekData.algorithmIntro ? String(weekData.algorithmIntro) : '').replace(/<[^>]+>/g, '');

      doc.setFontSize(9); doc.setTextColor(150, 150, 150);
      doc.text('LoneVLabs Cybersecurity \u2014 Flowchart Builder Lab', margin, pageH - 30);

      doc.setFont('times', 'normal'); doc.setFontSize(16); doc.setTextColor(60, 70, 90);
      const introMaxW = pageW - margin * 2;
      const wrapped = doc.splitTextToSize(introText, introMaxW);
      const introLineHeight = 16 * 1.15;
      const introBottomLimit = pageH - 50;
      let introY = 234;
      wrapped.forEach((line) => {
        if (introY > introBottomLimit) { doc.addPage(); drawBg(); introY = margin; }
        if (line.trim() !== '') doc.text(line, margin, introY, { maxWidth: introMaxW });
        introY += introLineHeight;
      });

      const canvas = await html2canvas(document.querySelector('.app'), { backgroundColor: '#0a0f1c', scale: 1.5, useCORS: true });
      const shotDataUrl = canvas.toDataURL('image/png');
      const imgProps = doc.getImageProperties(shotDataUrl);
      const shotMaxW = pageW - margin * 2;
      const naturalH = shotMaxW * (imgProps.height / imgProps.width);
      const imgLabelH = 18;
      const bottomLimit = pageH - 40;
      const remainingOnPage = bottomLimit - (introY + imgLabelH);

      if (remainingOnPage >= Math.min(naturalH, 140)) {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(18, 26, 43);
        doc.text('Student Work \u2014 Flowchart Builder', margin, introY + 12);
        let w = shotMaxW, h = naturalH;
        if (h > remainingOnPage) { h = remainingOnPage; w = (imgProps.width * h) / imgProps.height; }
        const shotX = margin + (shotMaxW - w) / 2;
        doc.addImage(shotDataUrl, 'PNG', shotX, introY + imgLabelH, w, h);
      } else {
        doc.addPage();
        drawBg();
        let py = margin;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(18, 26, 43);
        doc.text('Student Work \u2014 Flowchart Builder', margin, py);
        py += 20;
        const availH2 = pageH - margin - py;
        let w2 = shotMaxW, h2 = naturalH;
        if (h2 > availH2) { h2 = availH2; w2 = (imgProps.width * h2) / imgProps.height; }
        const shotX2 = margin + (shotMaxW - w2) / 2;
        doc.addImage(shotDataUrl, 'PNG', shotX2, py, w2, h2);
      }

      const safeName = (name || 'student').replace(/\s+/g, '_');
      doc.save('Flowchart_Lab_Report_' + safeName + '.pdf');
    } catch (err) {
      console.error(err);
      alert('Something went wrong generating the PDF. Please try again.');
    } finally {
      if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = originalLabel; }
    }
  }

  // ---- Week selection ----
  function updateWeekTitle(title) { weekTitleEl.textContent = title || ''; }
  function loadWeek(weekKey) {
    const raw = ALLWEEKS[weekKey];
    if (!raw) { alert('No flowchart data found for ' + weekKey + ' in the JSON file yet.'); return; }
    currentWeekKey = weekKey;
    weekData = parseWeek(raw);
    stepIndex = 0; actionIndex = 0;
    clearStage();
    clearHighlight();
    renderToolboxForWeek(weekData.toolbox);
    updateWeekTitle(weekData.title);
    certPdfBtn.disabled = true;
    renderActivityFeed();
    updateDashboard();
    showScenarioModal({
      title: weekData.flowchartTitle || weekData.title,
      introParagraphs: [weekData.algorithmIntro],
      requireStudentInfo: !studentName,
      okLabel: studentName ? '🛡️ START WEEK 🛡️' : '🛡️ LOAD CYBER LAB 🛡️'
    }, () => { updateStageHeader(); startStep(); });
  }

  // =====================================================================
  // ---- Weeks flip-card modal — redesigned, labels start at WEEK-3 ----
  //  The card *label* is (slot number + WEEK_LABEL_OFFSET). The JSON key
  //  driving loadWeek() is unchanged, so Week1-Flowchart still loads the
  //  first authored week — it just prints as WEEK-3.
  // =====================================================================
  function showWeeksModal() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const cardsHtml = ALL_WEEK_SLOT_KEYS.map(key => {
      const raw = ALLWEEKS[key];
      const slotNum = parseInt((key.match(/Week(\d+)/i) || [, '0'])[1], 10) || 0;
      const num = slotNum ? (slotNum + WEEK_LABEL_OFFSET) : '?';

      if (!raw) {
        return `
          <div class="flip-card locked" data-week="${key}">
            <div class="flip-card-inner">
              <div class="flip-card-front">
                <span class="fc-shield"><i class="fas fa-lock"></i></span>
                <div class="fc-line1">CYBER FLOWCHART</div>
                <div class="fc-line2">WEEK-${num}</div>
                <div class="fc-hint">coming soon</div>
              </div>
              <div class="flip-card-back">
                <span class="fc-lock"><i class="fas fa-lock"></i></span>
                <div class="fc-locked-label">LOCKED</div>
                <div class="fc-locked-sub">Not yet available</div>
              </div>
            </div>
          </div>`;
      }
      return `
        <div class="flip-card" data-week="${key}">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <span class="fc-shield"><i class="fas fa-shield-halved"></i></span>
              <div class="fc-line1">CYBER FLOWCHART</div>
              <div class="fc-line2">WEEK-${num}</div>
              <div class="fc-hint">hover to preview</div>
            </div>
            <div class="flip-card-back">
              <div class="fc-back-tag">WEEK-${num}</div>
              <div class="fc-title">${escapeHtml(raw.title || key)}</div>
              <button type="button" class="fc-load-btn">🛡️ LOAD</button>
            </div>
          </div>
        </div>`;
    }).join('');
    overlay.innerHTML = `
      <div class="modal-box weeks-modal-box">
        <h2>🛡️ Cybersecurity Flowchart Labs</h2>
        <div class="weeks-modal-sub">choose a <b>week</b> to begin · hover a card to flip</div>
        <div class="weeks-grid">${cardsHtml}</div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.flip-card:not(.locked)').forEach(card => {
      card.style.cursor = 'pointer';
      card.addEventListener('click', (e) => {
        if (e.target.closest('.fc-load-btn')) return;
        card.classList.toggle('flipped');
      });
      const loadBtn = card.querySelector('.fc-load-btn');
      loadBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = card.dataset.week;
        if (weekData && stepIndex < weekData.steps.length && key !== currentWeekKey) {
          if (!window.confirm('Switching weeks will reset your current progress on ' + currentWeekKey + '. Continue?')) return;
        }
        overlay.remove();
        loadWeek(key);
      });
    });
  }
  const changeWeekBtn = document.getElementById('changeWeekBtn');
  if (changeWeekBtn) {
    changeWeekBtn.addEventListener('click', () => {
      adminMenu.classList.remove('open');
      showWeeksModal();
    });
  }
  if (certPdfBtn) certPdfBtn.addEventListener('click', () => generateFlowchartPDF(studentName, studentId, studentGrade, certPdfBtn));

  // ---- 3D SCENE ----
  let renderer, scene, camera, controls, clock;

  function initThree() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1c);

    camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 290);
    camera.position.set(0, 40, 60);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    stageEl.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.8;
    controls.minDistance = 20;
    controls.maxDistance = 120;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.update();

    scene.add(new THREE.AmbientLight(0x446688, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(10, 20, 10);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0x4488cc, 0.4);
    fill.position.set(-10, 5, -10);
    scene.add(fill);

    const gridHelper = new THREE.GridHelper(80, 40, 0x2a4a6a, 0x1a2a44);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0f1c, roughness: 0.9, metalness: 0.1, transparent: true, opacity: 0.6 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    scene.add(ground);

    clock = new THREE.Clock();
    window.addEventListener('resize', onResize);
    animate();
  }

  function onResize() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  // ---- INIT ----
  initThree();
  clearStage();
  loadAllWeeksData().then(() => {
    if (loadError || !ALLWEEKS || !Object.keys(ALLWEEKS).length) {
      iconPoolGrid.innerHTML = '<div style="grid-column:1/-1;color:var(--danger);font-family:var(--mono);font-size:11px;text-align:center;padding:24px 6px;">Could not load "' + escapeHtml(JSON_PATH) + '". Make sure this HTML file and "' + escapeHtml(JSON_PATH) + '" are in the same folder and served over a web server, then reload the page.</div>';
      weekTitleEl.textContent = 'JSON file not found — see toolbox panel';
    } else {
      iconPoolGrid.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;padding:24px 6px;">Load a week from the flip-card menu to begin →</div>';
    }
    showWeeksModal();
  });
})();
