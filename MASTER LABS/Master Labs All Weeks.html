<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cyber Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0f1c; --bg-grid: #0d1424; --panel: #121a2b; --panel-2: #0e1526;
            --border: #223050; --border-soft: #1a2540; --text: #e7ecf5; --muted: #7c8aa5; --muted-2: #56637d;
            --clean: #3a4a6b; --clean-glow: #4d6087;
            --danger: #ff3b5c; --danger-glow: rgba(255,59,92,0.45);
            --c2: #8b6bff; --c2-glow: rgba(139,107,255,0.45);
            --amber: #ffb020; --amber-glow: rgba(255,176,32,0.45);
            --ok: #22d3a6; --ok-glow: rgba(34,211,166,0.4);
            --mono: 'IBM Plex Mono', monospace; --sans: 'Inter', sans-serif;
        }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            background: var(--panel); color: var(--text); font-family: var(--sans);
            height: 100vh; width: 100vw; margin: auto; padding: 0 12px;
            display: flex; flex-direction: column;
           
        }
        .app { height: 100%; width: 100%; display: flex; flex-direction: column; position: relative; }

        header.hero {
            display: flex; flex-direction: column; gap: 0px;
            border-bottom: 1px solid var(--border-soft); padding-bottom: 4px; flex-shrink: 0;
            position: relative;
            z-index: 201;
        }
        .eyebrow {
            font-family: var(--mono); font-size: 18px; letter-spacing: 0.1em; color:#22d3a6;
            display: flex; align-items: center; gap: 8px; font-weight: 700;
        }
        .eyebrow::before {
            content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--danger);
            box-shadow: 0 0 0 4px var(--danger-glow); animation: pulse-dot 3s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.35;} }

        /* ---- Admin menu (top-right) ---- */
        .admin-menu { position: absolute; top: 6px; right: 4px; z-index: 250; font-family: var(--sans); }
        .admin-menu-btn {
            background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
            padding: 7px 12px; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: border-color .2s;
        }
        .admin-menu-btn:hover { border-color: var(--c2); }
        .admin-menu-btn i { font-size: 10px; color: var(--muted); transition: transform .2s; }
        .admin-menu.open .admin-menu-btn i { transform: rotate(180deg); }
        .admin-menu-dropdown {
            display: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 180px;
            background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5); overflow: hidden; z-index: 260;
        }
        .admin-menu.open .admin-menu-dropdown { display: block; }
        .admin-menu-item { padding: 10px 14px; font-size: 12.5px; }
        .admin-menu-item.admin-menu-name {
            color: var(--text); font-weight: 700; letter-spacing: .02em;
            border-bottom: 1px solid var(--border-soft);
        }
        .admin-menu-item.admin-menu-feedback { color: var(--muted); cursor: pointer; transition: all .15s; }
        .admin-menu-item.admin-menu-feedback:hover { background: rgba(139,107,255,0.1); color: var(--c2); }

        .win-title .title-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c2); vertical-align: middle; }
        #activityFeed::-webkit-scrollbar { width: 0; height: 0; display: none; }

        /* ---- Command + explanation shown directly under the panel heading ---- */
        .win-cmd-info { margin: 0 0 6px; text-align: left; }
        .win-cmd-info .win-cmd-label { font-family: var(--mono); font-size: 11px; color: #ff8fa3; margin-bottom: 3px;}
        .win-cmd-info .win-cmd-line { font-family: var(--mono); font-size: 11.5px; color: #ff8fa3; margin-bottom: 4px; word-break: break-all; line-height: 1.4; background: transparent; }
        .win-cmd-info .win-cmd-line code { color: #ff8fa3; background: transparent; padding: 2px 6px; border-radius: 4px; font-size: 11.5px; }
        .win-cmd-info .win-cmd-explain { font-family: var(--sans); font-size: 10.5px; color: #ff8fa3; line-height: 1.35; opacity: .82; text-align: left; }

        /* ---- Desktop-icon terminal ---- */
.term-desktop-block { 
    margin: 2px 0 20px; 
    text-align: left;           
    flex-shrink: 0; 
    padding-left: 0;            
}

.term-desktop-titlebar { 
    font-family: var(--mono); 
    font-size: 12px; 
    color: var(--muted-2); 
    text-transform: uppercase; 
    font-weight: 800; 
    letter-spacing: .08em; 
    margin-bottom: 2px; 
    padding-left: 0;            
    margin-left: 0;             
}

.term-desktop-wrap {
    position: relative; 
    line-height: 1; 
    margin: 0 0 6px 0;          
    width: 100%;                
    text-align: left;           /* ensure left alignment */
    overflow: hidden;
    padding-left: 0;            
}

.term-desktop-wrap .term-desktop-emoji { 
    font-size: 190px;
    line-height: 1; 
    display: block;             /* changed from inline-block to block */
    margin-left: 0;             
    width: auto;                /* changed from 300px to auto */
    text-align: left;           
}

.term-desktop-input-wrap {
    position: absolute;
    left: 0;                    
    top: 10%;
    transform: translateX(0);   
    width: 72%;
    text-align: left;           
    display: flex;
    flex-direction: column;
    align-items: flex-start;    
    padding-left: 0;            
    margin-left: 0;             
}

.term-desktop-input-wrap .cmd-input { 
    width: 100%; 
    padding: 4px 6px; 
    font-size: 14px; 
    font-weight: 700; 
    text-align: left;           
    border-radius: 4px; 
    background: black; 
    height:25px; 
    color: #ffe066; 
    caret-color: #ffe066; 
    border: 1px solid rgba(57,255,106,0.3); 
    animation: cmdInputBorderFlash 2.2s ease-in-out infinite;
}
        @keyframes cmdInputBorderFlash { 0%, 100% { border-color: rgba(57,255,106,0.2); box-shadow: none; } 50% { border-color: #39ff6a; box-shadow: 0 0 7px rgba(57,255,106,0.7); } }
        .cmd-input.cmd-invalid { color: #ff3b5c !important; border-color: #ff3b5c !important; animation: none !important; box-shadow: 0 0 9px rgba(255,59,92,0.75) !important; }
        .cmd-test-label { font-weight: 800; margin: 10px 0 3px; text-transform: uppercase;text-align:center; }
        .cmd-list { flex: 0 0 auto; height: 240px; min-height: 240px; max-height: 240px; margin: 22px 0 6px; border-top:1px dashed rgba(255, 255, 255, 0.15); overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; display: flex; flex-direction: column; gap: 2px; }
        .appwin-spacer { flex: 1 1 auto; min-height: 0; }
        .cmd-list::-webkit-scrollbar { width: 0; display: none; }
        .offense-appwin > *:not(.cmd-list):not(.appwin-spacer), .defense-appwin > *:not(.cmd-list):not(.appwin-spacer) { flex-shrink: 0; }
.cmd-list-item {
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: normal;
    color: #CCCCCC;
    display: flex;
    align-items: center;
       gap: 6px;
    border-bottom: 1px dashed rgba(255, 255, 255, 0.15);  /* <-- thin dashed lighter */
    padding:1px 0;           /* <-- 4px top and bottom padding, 0 left and right */
}
        .cmd-list-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
        .cmd-list-item i { font-size: 10px; flex-shrink: 0; color: #ff6a7a; }
        .cmd-list-item.solved, .cmd-list-item.solved i { color: #39ff6a; }
        .cmd-list-item.hint-flash, .cmd-list-item.hint-flash i { background:black;color:yellow;animation: cmdHintFlash 1s ease-in-out infinite; }
        @keyframes cmdHintFlash { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        .win-cmd-explain { font-family: var(--mono); font-size: 13px; font-weight: 800; color: #39ff6a; text-align: left; margin-top: 8px; }
        .step-explain { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; text-align: left; color: var(--muted); margin: 0 0 6px; padding: 0; }

        @keyframes cmdLineFlash { 0%, 100% { opacity: 1; } 50% { opacity: .32; } }

        /* ---- Offense appWindow: text orange + left-aligned, command yellow ---- */
        .offense-appwin { text-align: left; color: #ffa733;padding-left:0px; display: flex; flex-direction: column; height: 100%; min-height: 0; }
        .offense-appwin .win-msg,
        .offense-appwin .step-explain,
        .offense-appwin .file-row,
        .offense-appwin .term-desktop-titlebar {
            color: color:#CCCCCC; text-align: left;border-bottom: 1px solid var(--border-soft);
        }
        .offense-appwin .win-cmd-info .win-cmd-label {
            color: #ffa733; text-align: center; background: transparent;
        }
        .offense-appwin .win-cmd-info .win-cmd-explain {
            color: #39ff6a; font-weight: 700; font-size: 13px; text-align: center;
        }
        .offense-appwin .win-cmd-info .win-cmd-line,
        .offense-appwin .win-cmd-info .win-cmd-line code {
            color: #39ff6a; text-align: center; background: #000; padding: 3px 6px; border-radius: 4px;
            animation: cmdLineFlash 1.8s ease-in-out infinite;
        }
        .offense-appwin .cmd-input { color: #ffe066; caret-color: #ffe066; }

        /* ---- Defense appWindow: text green + left-aligned, command yellow, button green ---- */
        .defense-appwin { text-align: left; color: var(--ok);padding-left:10px; display: flex; flex-direction: column; height: 100%; min-height: 0; }
        .defense-appwin .win-msg,
        .defense-appwin .step-explain,
        .defense-appwin .file-row,
        .defense-appwin .term-desktop-titlebar {
            color: var(--ok); text-align: left;
        }
        .defense-appwin .win-cmd-info .win-cmd-label {
            color: var(--ok); text-align: center; background: transparent;
        }
        .defense-appwin .win-cmd-info .win-cmd-explain {
            color: #39ff6a; font-weight: 700; font-size: 14px; text-align: center;
        }
        .defense-appwin .win-cmd-info .win-cmd-line,
        .defense-appwin .win-cmd-info .win-cmd-line code {
            color: #39ff6a; text-align: center; background: #000; padding: 3px 6px; border-radius: 4px;
            animation: cmdLineFlash 1.8s ease-in-out infinite;
        }
        .defense-appwin .cmd-input { color: #6dffb0; caret-color: #6dffb0; }
        .defense-appwin .win-btn.danger { background: var(--ok); border-color: var(--ok); color: #04241c; }

        /* ---- Certificate modal (matches base lab) ---- */
        .modal-box.certificate-modal {
            background-repeat: no-repeat; background-position: center center; background-size: contain;
            background-color: #eaf3fb;
            border: none; box-shadow: 0 20px 70px rgba(0,0,0,0.65);
            max-width: 640px; width: 92vw; max-height: none;
            aspect-ratio: 1536 / 1024;
            padding: 0; overflow: visible;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .cert-top-bar { padding: 3.2% 6% 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cert-lab-title {
            font-family: var(--sans); font-weight: 800; font-size: clamp(15px, 2.1vw, 19px);
            color: #0f4c81; letter-spacing: .03em; text-align: center; white-space: nowrap;
            width: 100%; overflow: hidden; text-overflow: ellipsis;
        }
        .cert-student-inline {
            display: flex; gap: 22px; flex-wrap: nowrap; justify-content: center; align-items: baseline;
            background: transparent; border: none; padding: 2px 0; width: 100%; overflow: hidden;
        }
        .cert-student-inline .cert-item { font-family: var(--sans); font-size: clamp(11px, 1.7vw, 15px); color: #10263c; white-space: nowrap; }
        .cert-student-inline .cert-item b { color: #0f4c81; font-weight: 800; }
        .cert-datetime {
            font-family: var(--sans); font-size: clamp(10px, 1.4vw, 12.5px); color: #3a5674;
            background: transparent; text-align: center; width: 100%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em;
        }
        .cert-bottom-bar { padding: 0 0 3.5%; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .cert-btn {
            background: #0f4c81; border: 1px solid #0f4c81; color: #fff; font-family: var(--sans);
            font-weight: 700; font-size: 13px; padding: 7px 18px; border-radius: 8px; cursor: pointer; transition: all .2s;
        }
        .cert-btn:hover:not(:disabled) { background: #0d3f6b; box-shadow: 0 4px 14px rgba(15,76,129,0.4); }
        .cert-btn:disabled { opacity: .6; cursor: not-allowed; }
        #certImgBtn { background: #22d3a6; border-color: #22d3a6; color: #04241c; }
        #certImgBtn:hover:not(:disabled) { background: #3ce0b5; box-shadow: 0 4px 14px rgba(34,211,166,0.4); }

        /* ---- Scenario modal (matches base lab) ---- */
        .modal-box.scenario-modal2 {
            position: relative;
            background-image: url('LabImages/ScenerioBg.png');
            background-repeat: no-repeat; background-position: center center; background-size: contain;
            background-color: #fbfeff;
            border: none; box-shadow: 0 20px 60px rgba(20,50,80,0.35);
            max-width: 640px; width: 100vw; max-height: none;
            aspect-ratio: 1536 / 1024;
            padding: 0; overflow: visible;
        }
       .scenario-lab-title {
    position: absolute;
    top: 45px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "Times New Roman", Times, serif;
    font-weight: bold;
    font-size:16px;
    color: #0f4c81;
}
        .scenario-para {
            position: absolute; top:85px; left: 6%; width: 88%; height:250px;
            overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
            padding:6px;border-top:1px dashed grey;border-bottom:1px dashed grey;border-radius:0px;

        }
        .scenario-para::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .scenario-para p {
            font-family: var(--sans); font-weight: 500; font-size: 14.5px; line-height: 1.0;
            color:blue; text-align: justify; margin: 0 0 0px;
        }
        .scenario-para p:last-child { margin-bottom: 0;color:black;font-size:16px;font-family: "Segoe UI", sans-serif;
font-weight: 400;
line-height: 1.6; }
        .scenario-para b { color: #0f4c81; font-weight: 700; }
        .scenario-input-row { position: absolute;bottom:60px; left: 6%; width: 88%; display: flex; gap: 10px;height:28px; }
        .scenario-input-row .si-name { width: 60%; }
        .scenario-input-row .si-sno { width: 20%;}
        .scenario-input-row .si-grade { width: 20%;}
        .scenario-input-row input[type="text"] {
            width: 100%; padding: 4px 4px; background: #ffffff; border: 1px solid rgba(59,123,176,0.35);
            border-radius: 8px; color: #10263c; font-family: var(--sans); font-size: 12.5px; margin: 0;
            text-transform: uppercase;height:28px;color:black;background:white;
        }
        .scenario-input-row input[type="text"]::placeholder { color: #8a9cae; text-transform: uppercase; }
        .scenario-input-row input[type="text"]:focus { outline: none; border-color: #0f4c81; }
        .scenario-form-error {
            position: absolute;bottom:90px; left: 6%; width: 88%; text-align: center;
            font-size: 13px; color: red; min-height: 14px;
        }
.scenario-start-btn-wrap {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    text-align: center;
}

.scenario-start-btn-wrap button {
    position: relative;
    display: inline-block;

    background-color: #2E2EFF;
    border: none;
    color: #DEDEDE;

    font-family: "Times New Roman", Times, serif;
    font-weight: bold;
    font-size:14px;

    padding: 6px 4px;
    border-radius: 0.5em;

    cursor: pointer;

    transition: box-shadow 0.2s;
}

.scenario-start-btn-wrap button::before {
    position: absolute;
    content: '';
    height: 0;
    width: 0;
    top: 0;
    left: 0;

 background-color:red;

    border-radius: 0 0 0.5em 0;
    transition: 0.3s;
}

.scenario-start-btn-wrap button:hover::before {
    width: 1.6em;
    height: 1.6em;
}

.scenario-start-btn-wrap button:active {
    box-shadow: 0.2em 0.2em 0.3em rgba(0, 0, 0, 0.3);
}

        main.layout {
            display: grid; grid-template-columns: 260px 1fr 150px; gap: 4px;
            flex: 1; min-height: 0; height: 100%;
            position: relative;
        }
        @media(max-width:1100px) { main.layout { grid-template-columns: 1fr; } }

        .panel { background: var(--panel); border: 1px solid var(--border-soft); padding: 12px 14px; overflow: hidden; }
        .panel.sidebar {
            border-radius: 0; display: flex; flex-direction: column; padding: 5px 5px; height: 100%;
            overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
            margin-left: -12px; border-left: 0;
            position: relative;
            z-index: 1;
        }
        .panel.sidebar::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .panel.sidebar.right-side { margin-left: 0; border-left: 1px solid var(--border-soft); margin-right: -12px; border-right: 0; }

        /* ----- toolbox left ----- */
        .instr-title { font-family: var(--mono); font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
        .instr-text { font-size: 14px; line-height: 1.5; color: grey; }
        .instr-text b { color: var(--amber); }
        .instr-text em.tag { font-style: normal; font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; color: var(--c2); }

        .pool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
        .pool-item {
            background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 7px;
            padding: 2px; text-align: center; cursor: pointer; user-select: none; min-width: 0; box-sizing: border-box;
            transition: border-color .2s, transform .15s, box-shadow .2s;
        }
        .pool-item:hover { border-color: var(--danger); transform: translateY(-2px); box-shadow: 0 4px 14px var(--danger-glow); }
        .pool-item:active { transform: scale(0.95); }
        .pool-item .p-icon { font-size: 32px; display: block; line-height: 1.15; color: var(--text); }
        .pool-item .p-icon i { font-size: 38px; display: inline-block; width: 100%; color: #ffa733; }
        .pool-item .p-label { font-size: 9.5px; font-weight: 800; font-family: var(--mono); color: #ffa733; display: block; margin-top: 2px; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #toolboxPanel.defense-mode .pool-item .p-icon i { color: var(--ok); }
        #toolboxPanel.defense-mode .pool-item .p-label { color: var(--ok); }
        .pool-item.wrong-flash { animation: toolboxWrong .5s ease; border-color: var(--danger) !important; }
        @keyframes toolboxWrong { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
        .pool-item.placed-item { opacity: .38; cursor: default; }
        .pool-item.placed-item:hover { transform: none; box-shadow: none; border-color: var(--border-soft); }
        .pool-item.target-glow {
            border-color: var(--ok);
            box-shadow: 0 0 0 2px rgba(34,211,166,0.25), 0 0 16px var(--ok-glow);
            animation: targetGlowPulse 1.4s ease-in-out infinite;
        }
        @keyframes targetGlowPulse {
            0%, 100% { box-shadow: 0 0 0 2px rgba(34,211,166,0.25), 0 0 10px var(--ok-glow); }
            50% { box-shadow: 0 0 0 3px rgba(34,211,166,0.4), 0 0 22px var(--ok-glow); }
        }
        .toolbox-progress { font-family: var(--mono); font-size: 9.5px; color: var(--muted-2); margin-top: 8px; text-align: center; }
        #toolboxPanel { padding: 8px 4px; }
        #toolboxPanel .instr-title { margin-bottom: 3px; }
        #toolboxPanel .instr-text { font-size: 11.5px; margin-bottom: 6px; line-height: 1.35; }

        /* ---- stage panel ---- */
        .stage-panel { padding: 0; overflow: hidden; display: flex; flex-direction: column; border-radius: 50px; height:99%;border:0px solid white; }
        .stage3d { position: relative; flex: 1; min-height: 0; background: var(--panel-2); border-bottom: 1px solid var(--border-soft); }
        .stage3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
        .stage3d canvas.orbiting { cursor: grabbing; }

        .status-badge {
            position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
            font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em;
            padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: rgba(14,21,38,.88);
            color: var(--ok); transition: color .8s, border-color .8s, background .8s; pointer-events: none; z-index: 5;.win-msg b
        }
        .status-badge.warn { color: var(--amber); border-color: var(--amber); background: rgba(255,176,32,.10); }
        .status-badge.danger { color: var(--danger); border-color: var(--danger); background: rgba(255,59,92,.10); }

        .labels-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }

        .anim-seq-badge {
            position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 7;
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: var(--mono); font-weight: 800; font-size: 12.5px;
            background: transparent; border: 2.5px solid currentColor;
            box-shadow: 0 0 8px currentColor;
            opacity: 0; transition: opacity .35s ease;
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // ---- JSON-driven multi-lab data source ----
      const LAB_JSON_PATH = "ALL JSON/Labs/AllWeeksLabs.json";
      let LAB_DATA = null;
      let LAB_DATA_PROMISE = null;
      function loadLabData() {
        if (window.location.protocol === 'file:') {
          return Promise.reject(new Error(
            'This page was opened directly as a file (file://). Browsers block loading local JSON ' +
            'over fetch() from file://. Serve this folder from a local web server (e.g. "python3 -m ' +
            'http.server" in the folder above "ALL JSON", then open http://localhost:8000/<this file>) ' +
            'and reload.'
          ));
        }
        if (!LAB_DATA_PROMISE) {
          LAB_DATA_PROMISE = fetch(encodeURI(LAB_JSON_PATH)).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + LAB_JSON_PATH);
            return r.json();
          }).then(d => { LAB_DATA = d; return d; }).catch(err => { LAB_DATA_PROMISE = null; throw err; });
        }
        return LAB_DATA_PROMISE;
      }
    </script>
</head>

<script>
(function() {
  const CONN_SAFE_COLOR = 0x22d3a6;
  const CONN_UNSAFE_COLOR = 0xff3b5c;

  const stageMeta = [
    { label: 'Identify Target',    desc: 'The Outsider searches the employee directory to find a target.' },
    { label: 'Study Behavior',     desc: "The employee's work patterns are profiled to plan an approach." },
    { label: 'Build Trust',        desc: 'The Outsider poses as a trusted vendor to open contact.' },
    { label: 'Create Urgency',     desc: 'An urgent alert pressures the employee to act quickly.' },
    { label: 'Request Information', desc: 'A false pretext is used to ask for account information.' },
    { label: 'Influence Action',   desc: "The employee is manipulated into following the caller's instructions." },
    { label: 'Obtain Access',      desc: 'Impersonation is used to request access to a restricted area.' },
    { label: 'Review Impact',      desc: 'The impact of the impersonation and stolen information is reviewed.' }
  ];

  // ---- CYBER TEST quiz data (populated dynamically per-lab from JSON; see applyLabData) ----
  let quizMCQs = [];
  let quizMatchingA = [];
  let quizMatchingB = {};
  let quizMatchingAnswer = [];
  let quizShortQuestions = [];
  let quizTotalPoints = 0;

  // Reshuffle each MCQ's options so the correct answer isn't always in slot A. Called once
  // per lab load (from applyLabData), not just at module init, since the question set changes.
  function shuffleQuizOptions() {
    const letters = ['A', 'B', 'C', 'D'];
    quizMCQs.forEach(item => {
      const values = letters.map(l => item.options[l]);
      const correctValue = item.options[item.answer];
      for (let i = values.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [values[i], values[j]] = [values[j], values[i]];
      }
      const newOptions = {};
      letters.forEach((l, i) => { newOptions[l] = values[i]; });
      item.options = newOptions;
      item.answer = letters.find(l => newOptions[l] === correctValue);
    });
  }

  let quizStepIndex = 0;
  let quizMcqAnswers = [];
  let quizMatchingAnswers = [];
  let quizShortAnswers = [];
  let quizScore = 0;
  let quizCompleted = false;

  let stage = 0;
  let securityScore = 100;
  let exfilKB = 0;
  let exfilTimer = null;
  let stepScreenshots = [];
  let flashCardTimer = null;
  let linesArr = [];
  let linePulseIntervals = [];
  let seqBadges = [];
  let animSeqCounter = 0;
  let studentName = '';
  let studentId = '';
  let studentGrade = '';
  let TOTAL_OFFENSE_STAGES = 8;
  let TOTAL_DEFENSE_STAGES = 8;
  let SCENARIO_TITLE = '';
  let SCENARIO_DESCRIPTION_HTML = '<p>Select a Week Lab above to begin.</p>';
  let OFFENSE_COMPLETION_TEXT = '';
  let DEFENSE_COMPLETION_TEXT = '';
  // Renders the JSON's short per-command completion summary (lab.offense/defense.completion,
  // one <=5-word entry per merged command) as a bold, larger-font checklist instead of a
  // wall of text.
  function buildCompletionListHTML(items, isDefense) {
    if (!items || !items.length) return '';
    const accent = isDefense ? '#22d3a6' : '#ff8a5c';
    const rows = items.map((txt, i) => `
      <div style="display:flex; align-items:center; gap:12px; margin:10px 0;">
        <span style="color:${accent}; font-size:22px; font-weight:800;">${isDefense ? '🛡️' : '⚡'}</span>
        <span style="font-size:19px; font-weight:800; line-height:1.35; color:#f1f5f9;">${escapeHtmlText(txt)}</span>
      </div>`).join('');
    return `<div style="margin-top:10px;">${rows}</div>`;
  }
  function escapeHtmlText(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Turns raw scenario description text into paragraph(s), bolding "Offense:"/"Defense:" markers.
  function buildScenarioDescriptionHTML(text) {
    if (!text) return '<p>Select a Week Lab above to begin.</p>';
    const escaped = escapeHtmlText(text)
      .replace(/(Offense:)/g, '<b>$1</b>')
      .replace(/(Defense:)/g, '<b>$1</b>');
    return `<p>${escaped}</p>`;
  }

  // ---- Defense module state ----
  let defenseActive = false;
  let defenseSelectionIndex = 0;
  let defenseSelectionComplete = false;
  let defenseStage = 0;
  let defenseComplete = false;
  let defenseFullQueue = [];
  let defenseObjs = { envelope: null, padlock: null, key: null, database: null };
  let isReporting = false, isResetting = false, isMfaOn = false, isBlockingDomain = false, isRevoking = false, isAuditing = false, isTraining = false;
  let checkDefenseRunning = false;

  const instrText = document.getElementById('instrText');
  const actionBtn = document.getElementById('actionBtn');
  const statInfected = document.getElementById('statInfected');
  const statStage = document.getElementById('statStage');
  const statExfil = document.getElementById('statExfil');
  const statHealth = document.getElementById('healthText');
  const healthFill = document.getElementById('healthFill');
  const flashStatValue = document.getElementById('flashStatValue');
  const stageEl = document.getElementById('stage3d');
  const statusBadge = document.getElementById('statusBadge');
  const tooltip3d = document.getElementById('tooltip3d');
  const toolboxPanel = document.getElementById('toolboxPanel');
  const toolboxPrompt = document.getElementById('toolboxPrompt');
  const iconPoolGrid = document.getElementById('iconPoolGrid');
  const toolboxProgress = document.getElementById('toolboxProgress');
  const winScrim = document.getElementById('winScrim');
  const appWindow = document.getElementById('appWindow');
  const winTitle = document.getElementById('winTitle');
  const appWinBody = document.getElementById('appWinBody');
  const labelsLayer = document.getElementById('labelsLayer');
  const activityFeedEl = document.getElementById('activityFeed');
  const resetBtn = document.getElementById('resetBtn');
  const flashStat = document.getElementById('flashStat');

  function showFlashCard(icon, title, desc, duration) {
    clearTimeout(flashCardTimer);
    flashStatValue.innerHTML = `<div class="flash-row"><div class="flash-icon">${icon}</div><div class="flash-msg"><b>${title}</b>${desc}</div></div>`;
    // Status stays visible until the next action replaces it (no auto-revert to idle).
  }

  async function captureStep(label) {
    try {
      const canvas = await html2canvas(document.querySelector('.app'), { backgroundColor: '#0a0f1c', scale: 1.3, useCORS: true, ignoreElements: (el) => el.id === 'appWindow' });
      stepScreenshots.push({ label: label, dataUrl: canvas.toDataURL('image/png') });
    } catch (err) { console.error('screenshot capture failed for', label, err); }
  }

  function showScenarioModal(callback) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box scenario-modal2">
        <div class="scenario-lab-title">${sanitizeCertTitle(CERT_LAB_TITLE)}</div>
        <div class="scenario-para">
          ${SCENARIO_TITLE ? `<p style="opacity:.75; font-size:.9em;"><b>${escapeHtmlText(SCENARIO_TITLE)}</b></p>` : ''}
          ${SCENARIO_DESCRIPTION_HTML}
        </div>
        <div class="scenario-input-row">
          <div class="si-name"><input type="text" id="scenarioName" placeholder="STUDENT NAME" autocomplete="off" value="${studentName.replace(/"/g, '&quot;')}"></div>
          <div class="si-sno"><input type="text" id="scenarioId" placeholder="SNO" autocomplete="off" value="${studentId.replace(/"/g, '&quot;')}"></div>
          <div class="si-grade"><input type="text" id="scenarioGrade" placeholder="GRADE" autocomplete="off" value="${studentGrade.replace(/"/g, '&quot;')}"></div>
        </div>
        <div class="scenario-form-error" id="scenarioFormError"></div>
        <div class="scenario-start-btn-wrap"><button id="briefOk">🛡️LOAD CYBER LAB🛡️</button></div>
      </div>`;
    document.body.appendChild(overlay);
    const nameEl = overlay.querySelector('#scenarioName');
    const idEl = overlay.querySelector('#scenarioId');
    const gradeEl = overlay.querySelector('#scenarioGrade');
    const errEl = overlay.querySelector('#scenarioFormError');
    overlay.querySelector('#briefOk').addEventListener('click', () => {
      const name = nameEl.value.trim(), id = idEl.value.trim(), grade = gradeEl.value.trim();
      if (!name || !id || !grade) { errEl.textContent = 'Please fill in your name, student ID, and grade/class to begin.'; return; }
      studentName = name; studentId = id; studentGrade = grade;
      overlay.remove();
      callback();
    });
  }

  function updateStageChrome() {
    statStage.textContent = `${Math.min(stage, TOTAL_OFFENSE_STAGES)} / ${TOTAL_OFFENSE_STAGES}`;
  }

  function setStatusBadge(text, cls) {
    statusBadge.textContent = text;
    statusBadge.className = 'status-badge' + (cls ? ' ' + cls : '');
  }

  function setSecurity(value, colorStops) {
    securityScore = value;
    statHealth.textContent = Math.round(value) + '%';
    healthFill.style.width = value + '%';
    healthFill.style.background = colorStops || 'linear-gradient(90deg,#22c55e,#8de8c9)';
  }

  // ---- TOOLBOX (populated dynamically from the loaded week-lab JSON; see applyLabData) ----
  let TOOLBOX_ICONS = [];
  let requiredQueue = [];
  let NEW_DEFENSE_TOOLS = [];
  let NODE_ORDER = [];

  // Turns a JSON tool/actor label into a stable internal node key.
  function slugType(label) {
    return String(label).toLowerCase().replace(/[^a-z0-9]+/g, '') || 'node';
  }

  // Heuristic Font Awesome icon for a toolbox pool entry, based on its label text.
  function pickIcon(label) {
    const l = String(label).toLowerCase();
    if (l.includes('outsider')) return 'fas fa-user-secret';
    if (l.includes('directory')) return 'fas fa-address-book';
    if (l.includes('activity') && l.includes('monitor')) return 'fas fa-chart-line';
    if (l.includes('monitor')) return 'fas fa-desktop';
    if (l.includes('communication')) return 'fas fa-headset';
    if (l.includes('dashboard')) return 'fas fa-gauge-high';
    if (l.includes('identity')) return 'fas fa-id-card';
    if (l.includes('access control') || l.includes('control panel')) return 'fas fa-sliders';
    if (l.includes('access')) return 'fas fa-door-open';
    if (l.includes('portal') && l.includes('security')) return 'fas fa-flag';
    if (l.includes('training') || l.includes('trainer')) return 'fas fa-graduation-cap';
    if (l.includes('gateway') || l.includes('network')) return 'fas fa-network-wired';
    if (l.includes('server') || l.includes('authentication')) return 'fas fa-server';
    if (l.includes('laptop')) return 'fas fa-laptop';
    if (l.includes('console') || l.includes('terminal')) return 'fas fa-terminal';
    if (l.includes('officer') || l.includes('analyst')) return 'fas fa-user-shield';
    if (l.includes('manager')) return 'fas fa-user-tie';
    if (l.includes('employee')) return 'fas fa-user';
    return 'fas fa-cube';
  }

  // Heuristic 3D-stage emoji for a placeable node, based on its label text.
  function pickEmoji(label) {
    const l = String(label).toLowerCase();
    if (l.includes('outsider')) return '🕵️';
    if (l.includes('directory')) return '📇';
    if (l.includes('activity') && l.includes('monitor')) return '📈';
    if (l.includes('monitor')) return '🖥️';
    if (l.includes('communication')) return '☎️';
    if (l.includes('dashboard')) return '📊';
    if (l.includes('identity')) return '🪪';
    if (l.includes('access control') || l.includes('control panel')) return '🎛️';
    if (l.includes('access')) return '🚪';
    if (l.includes('portal') && l.includes('security')) return '🚩';
    if (l.includes('training')) return '🎓';
    if (l.includes('gateway') || l.includes('network')) return '🌐';
    if (l.includes('server') || l.includes('authentication')) return '🗄️';
    if (l.includes('laptop')) return '💻';
    if (l.includes('console') || l.includes('terminal')) return '🖥️';
    return '📦';
  }
  function toolNodePos(key) {
    const centerKey = defenseActive ? 'defterm' : 'outsider';
    if (key === centerKey) return new THREE.Vector3(0, 0, 0);
    const perimeterKeys = NODE_ORDER.filter(k => k !== centerKey);
    const idx = perimeterKeys.indexOf(key);
    const total = perimeterKeys.length;
    const margin = 0.5;
    const xMin = BOUNDARY.xMin + margin, xMax = BOUNDARY.xMax - margin;
    const zMin = BOUNDARY.zMin + margin, zMax = BOUNDARY.zMax - margin;
    const w = xMax - xMin, d = zMax - zMin;
    const perimeter = 2 * (w + d);
    let rem = ((idx + 0.5) / total) * perimeter;
    if (rem <= w) return new THREE.Vector3(xMin + rem, 0, zMin);
    rem -= w;
    if (rem <= d) return new THREE.Vector3(xMax, 0, zMin + rem);
    rem -= d;
    if (rem <= w) return new THREE.Vector3(xMax - rem, 0, zMax);
    rem -= w;
    return new THREE.Vector3(xMin, 0, zMax - rem);
  }
  let TOOL_DEFS = {};
  function spawnToolNode(key) {
    const def = TOOL_DEFS[key];
    if (!def) return;
    const pos = toolNodePos(key);
    const canvas = document.createElement('canvas');
    canvas.width = 160; canvas.height = 160;
    const ctx = canvas.getContext('2d');
    ctx.font = '120px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.emoji, 80, 84);
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(def.w, def.h, 1);
    sprite.position.set(pos.x, def.h / 3.5, pos.z);
    sprite.userData.type = key;
    sprite.userData.displayName = def.name;
    scene.add(sprite);
    popInScaleSprite(sprite, def.w, def.h, 480);
    nodes[key] = sprite;
    return sprite;
  }

  // OFFENSE_STEPS / DEFENSE_STEPS are populated dynamically from the loaded week-lab JSON (see applyLabData)
  let OFFENSE_STEPS = [];
  let DEFENSE_STEPS = [];

  let selectionIndex = 0;
  let selectionComplete = false;

  function renderToolbox() {
    iconPoolGrid.innerHTML = '';
    TOOLBOX_ICONS.forEach(ic => {
      const div = document.createElement('div');
      div.className = 'pool-item';
      div.dataset.type = ic.type;
      div.innerHTML = `<span class="p-icon"><i class="${ic.icon}"></i></span><span class="p-label">${ic.label}</span>`;
      div.addEventListener('click', () => onToolboxIconClick(ic.type, div));
      iconPoolGrid.appendChild(div);
    });
    updateToolboxGlow();
  }

  function updateToolboxGlow() {
    const needType = defenseActive
      ? ((!defenseSelectionComplete && defenseFullQueue[defenseSelectionIndex]) ? defenseFullQueue[defenseSelectionIndex].type : null)
      : ((!selectionComplete && requiredQueue[selectionIndex]) ? requiredQueue[selectionIndex].type : null);
    [...iconPoolGrid.children].forEach(child => {
      child.classList.toggle('target-glow', !!needType && child.dataset.type === needType);
    });
  }

  function updateToolboxPrompt() {
    const titleEl = toolboxPanel.querySelector('.instr-title');
    if (defenseActive) {
      if (titleEl) titleEl.textContent = 'DEFENSIVE TOOLKIT';
      if (defenseSelectionComplete) {
        toolboxPrompt.innerHTML = `<b>🛡️ Response team assembled &amp; defense toolkit deployed.</b> Follow the Defense Control Panel to secure it.`;
        toolboxProgress.textContent = '';
      } else {
        const need = defenseFullQueue[defenseSelectionIndex];
        toolboxPrompt.innerHTML = `Select:<b>${need.label}</b>`;
        toolboxProgress.textContent = `${defenseSelectionIndex} / ${defenseFullQueue.length} placed`;
      }
      updateToolboxGlow();
      return;
    }
    if (titleEl) titleEl.textContent = 'OFFENSIVE TOOLKIT';
    if (selectionComplete) {
      toolboxPrompt.innerHTML = `<b>✅ Toolbox complete.</b> All objects are placed — the lab is ready.`;
      toolboxProgress.textContent = '';
      updateToolboxGlow();
      return;
    }
    const need = requiredQueue[selectionIndex];
    if (!need) {
      toolboxPrompt.textContent = 'Select a Week Lab above to begin.';
      toolboxProgress.textContent = '';
      updateToolboxGlow();
      return;
    }
    toolboxPrompt.innerHTML = `Select:<b>${need.label}</b>`;
    toolboxProgress.textContent = `${selectionIndex} / ${requiredQueue.length} placed`;
    updateToolboxGlow();
  }

  function onToolboxIconClick(type, el) {
    if (defenseActive) { onDefenseToolboxIconClick(type, el); return; }
    if (selectionComplete) return;
    const need = requiredQueue[selectionIndex];
    if (!need) return;
    if (type === need.type) {
      placeRequiredObject(need);
      el.classList.add('placed-item');
      el.classList.remove('target-glow');
      selectionIndex++;
      if (selectionIndex >= requiredQueue.length) {
        finishSelection();
      } else {
        updateToolboxPrompt();
      }
    } else {
      el.classList.add('wrong-flash');
      setTimeout(() => el.classList.remove('wrong-flash'), 500);
      showFlashCard('⚠️', 'Not quite', `That's not what we need right now — we're looking for the ${need.label}.`, 1800);
    }
  }

  function onDefenseToolboxIconClick(type, el) {
    if (defenseSelectionComplete) return;
    const need = defenseFullQueue[defenseSelectionIndex];
    if (type === need.type) {
      placeDefenseObject(need);
      el.classList.add('placed-item');
      el.classList.remove('target-glow');
      defenseSelectionIndex++;
      if (defenseSelectionIndex >= defenseFullQueue.length) {
        defenseSelectionComplete = true;
        updateToolboxPrompt();
        showFlashCard('🛡️', 'Defense Toolkit Deployed', 'All objects are back on the stage and your defensive tools are deployed — begin remediation in the Defense Control Panel.', 3000);
        defenseStage = 1;
        captureStep('Defense — Toolkit Deployed');
        openWin(`♻️ DEFENSE MODE ♻️`);
        updateDefenseWindow();
      } else {
        updateToolboxPrompt();
      }
    } else {
      el.classList.add('wrong-flash');

  function popInScale(group, targetScale, duration) {
    group.scale.setScalar(0.001);
    const t0 = performance.now();
    function step() {
      const t = Math.min(1, (performance.now() - t0) / duration);
      const k = 1 - Math.pow(1 - t, 3);
      const overshoot = t < 1 ? 1 + Math.sin(t * Math.PI) * 0.18 : 1;
      group.scale.setScalar(targetScale * k * overshoot);
      if (t < 1) requestAnimationFrame(step); else group.scale.setScalar(targetScale);
    }
    step();
  }

  function popInScaleSprite(sprite, tw, th, duration) {
    const t0 = performance.now();
    function step() {
      const t = Math.min(1, (performance.now() - t0) / duration);
      const k = 1 - Math.pow(1 - t, 3);
      const overshoot = t < 1 ? 1 + Math.sin(t * Math.PI) * 0.18 : 1;
      sprite.scale.set(tw * k * overshoot, th * k * overshoot, 1);
      if (t < 1) requestAnimationFrame(step); else sprite.scale.set(tw, th, 1);
    }
    step();
  }

  function allPlacedObjects() {

  function showTooltipAt(text, x, y) {
    tooltip3d.textContent = text;
    tooltip3d.style.left = x + 'px';
    tooltip3d.style.top = y + 'px';
    tooltip3d.classList.add('show');

  function hideTooltip() { tooltip3d.classList.remove('show'); }

  function onPointerHover(e) {
    if (dragState) { hideTooltip(); return; }
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    const hits = [];
    allPlacedObjects().forEach(g => hits.push(...raycaster.intersectObject(g, true)));
    hits.sort((a,b) => a.distance - b.distance);
    if (!hits.length) { hideTooltip(); return; }
    let obj = hits[0].object;
    while (obj && obj.userData.displayName === undefined) obj = obj.parent;
    if (obj) {
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      showTooltipAt(obj.userData.displayName + ' — drag to move', x, y);
    } else hideTooltip();
  }

  let dragState = null;
  const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.01);

  function nodeRootOf(obj) {
    while (obj && obj.userData.type === undefined) obj = obj.parent;
    return obj;
  }

  function onPointerDown(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    const hits = [];
    allPlacedObjects().forEach(g => hits.push(...raycaster.intersectObject(g, true)));
    hits.sort((a,b) => a.distance - b.distance);
    if (!hits.length) return;
    const node = nodeRootOf(hits[0].object);
    if (!node) return;
    const intersection = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
      dragState = { node, offset: intersection.clone().sub(node.position) };
      controls.enabled = false;
      renderer.domElement.classList.add('orbiting');
      hideTooltip();
    }
  }

  function onPointerDragMove(e) {
    if (!dragState) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    const intersection = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
      const newPos = intersection.clone().sub(dragState.offset);
      const margin = 2.0;
      dragState.node.position.x = Math.min(BOUNDARY.xMax - margin, Math.max(BOUNDARY.xMin + margin, newPos.x));
      dragState.node.position.z = Math.min(BOUNDARY.zMax - margin, Math.max(BOUNDARY.zMin + margin, newPos.z));
    }
  }

  function onPointerUp(e) {
    if (dragState) {
      dragState = null;
      controls.enabled = true;
      renderer.domElement.classList.remove('orbiting');
    }
  }

  function popPulse(group, duration, magnitude, baseScale) {
    if (!group) return;
    const base = baseScale !== undefined ? baseScale : group.scale.x;
    const t0 = performance.now();
    const dur = duration || 900, mag = magnitude || 0.22;
    function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      const k = Math.sin(t * Math.PI);
      group.scale.setScalar(base * (1 + mag * k));
      if (t < 1) requestAnimationFrame(step); else group.scale.setScalar(base);
    }
    step();
  }

  function popPulseSprite(sprite, tw, th, duration, magnitude) {
    if (!sprite) return;
    const t0 = performance.now();
    const dur = duration || 900, mag = magnitude || 0.2;
    function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      const k = Math.sin(t * Math.PI);
      sprite.scale.set(tw * (1 + mag * k), th * (1 + mag * k), 1);
      if (t < 1) requestAnimationFrame(step); else sprite.scale.set(tw, th, 1);
    }
    step();
  }

  function spawnRipple(position, hexColor, duration) {
    const geo = new THREE.RingGeometry(0.05, 0.2, 32);
    const mat = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = -Math.PI/2;
    ring.position.set(position.x, 0.02, position.z);
    scene.add(ring);
    const t0 = performance.now(); const dur = duration || 900;
    function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      ring.scale.setScalar(0.4 + t * 5);
      mat.opacity = 0.85 * (1 - t);
      if (t < 1) requestAnimationFrame(step); else scene.remove(ring);
    }
    step();
  }

  function worldToScreen(pos) {
    camera.updateMatrixWorld();
    const v = pos.clone().project(camera);
    const rect = stageEl.getBoundingClientRect();
    return { x: (v.x * 0.5 + 0.5) * rect.width, y: (-v.y * 0.5 + 0.5) * rect.height, behind: v.z > 1 };

  function addSeqBadge(seqNum, getPosFn, cls, expireMs) {

  function removeSeqBadge(entry) {

      entry.el.style.left = s.x + 'px';

  function playSequence(steps) {

  let activeConnections = [];
  const CONN_THICKNESS = 0.16;
  const connUnitGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true);
  const CONN_UP = new THREE.Vector3(0, 1, 0);

  function orientConnMesh(mesh, fromPos, toPos) {
    const from = new THREE.Vector3(fromPos.x, 0.6, fromPos.z);
    const to = new THREE.Vector3(toPos.x, 0.9, toPos.z);
    const dir = new THREE.Vector3().subVectors(to, from);
    const length = Math.max(dir.length(), 0.001);
    const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
    mesh.position.copy(mid);
    mesh.scale.set(CONN_THICKNESS, length, CONN_THICKNESS);
    mesh.quaternion.setFromUnitVectors(CONN_UP, dir.normalize());
  }

  function draw3DLine(fromKey, toKey, safe, opts) {
    opts = opts || {};
    const fromNode = nodes[fromKey], toNode = nodes[toKey];
    if (!fromNode || !toNode) return null;
    const hexColor = safe ? CONN_SAFE_COLOR : CONN_UNSAFE_COLOR;
    const dur = opts.duration || 2200;
    const mat = new THREE.MeshBasicMaterial({ color: hexColor, transparent: true, opacity: 0.6 });
    const mesh = new THREE.Mesh(connUnitGeo, mat);
    orientConnMesh(mesh, fromNode.position, toNode.position);
    scene.add(mesh);
    linesArr.push(mesh);
    activeConnections.push({ fromKey, toKey, mesh, hexColor });
    spawnLineTravelPulse(fromNode.position, toNode.position, hexColor, dur);
    const intervalId = setInterval(() => {
      const fn = nodes[fromKey], tn = nodes[toKey];
      if (fn && tn) spawnLineTravelPulse(fn.position, tn.position, hexColor, dur);
    }, dur + 1400);
    linePulseIntervals.push(intervalId);
    return mesh;
  }

  function clear3DLines(preserveFeed) {
    linesArr.forEach(l => scene.remove(l));
    linesArr = [];
    activeConnections = [];
    linePulseIntervals.forEach(id => clearInterval(id));
    linePulseIntervals = [];
    seqBadges.slice().forEach(f => { if (f.el && f.el.parentNode) f.el.parentNode.removeChild(f.el); });
    seqBadges = [];
    if (!preserveFeed) {
      activityFeedEl.innerHTML = '';
      animSeqCounter = 0;
    }
  }

  function spawnLineTravelPulse(fromPos, toPos, hexColor, duration) {
    const mat = new THREE.MeshStandardMaterial({ color: hexColor, emissive: hexColor, emissiveIntensity: 1.1 });
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 10), mat);
    dot.position.set(fromPos.x, 0.72, fromPos.z);
    scene.add(dot);
    const t0 = performance.now(); const dur = duration || 2200;
    function step() {
      const t = Math.min(1, (performance.now() - t0) / dur);
      const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2) / 2;
      dot.position.x = fromPos.x + (toPos.x - fromPos.x) * ease;
      dot.position.z = fromPos.z + (toPos.z - fromPos.z) * ease;
      dot.position.y = 0.6 + (0.9 - 0.6) * ease;
      mat.emissiveIntensity = 1.1 * (1 - t * 0.3);
      if (t < 1 && dot.parent) requestAnimationFrame(step); else scene.remove(dot);
    }
    step();
  }

  function spawnBreachIcon() {
    if (!nodes.target) return;
    const canvas = document.createElement('canvas');
    canvas.width = 96; canvas.height = 96;
    const ctx = canvas.getContext('2d');
    ctx.font = '64px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔓', 48, 48);
    const texture = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(1.6, 1.6, 1);
    sprite.position.set(targetPos.x, 3.2, targetPos.z);
    scene.add(sprite);
    breachIcon = sprite;
    const t0 = performance.now();
    function step() {
      const t = Math.min(1, (performance.now() - t0) / 600);
      mat.opacity = t;
      sprite.position.y = 3.2 + Math.sin(t * Math.PI) * 0.15;
      if (t < 1) requestAnimationFrame(step);
    }
    step();
  }

  function morphBreachIconToLock() {
    if (!breachIcon) return;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (nodes.system) nodes.system.rotation.y = Math.sin(t * 0.25) * 0.02;
    if (nodes.attackerLaptop) nodes.attackerLaptop.rotation.y = Math.sin(t * 0.22 + 1) * 0.02;

    activeConnections.forEach(conn => {

  // ---- Command bank: full shuffled list of every command for a mode, with
  // solved-tracking, wrong-attempt counting, and a hint-after-3-fails flow ----
  const offenseCmdState = { order: [], solved: new Set(), attempts: 0, hintShown: false, initialized: false };
  const defenseCmdState = { order: [], solved: new Set(), attempts: 0, hintShown: false, initialized: false };

  function shuffledIndices(n) {
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function ensureCmdOrderInit(mode) {
    const state = mode === 'offense' ? offenseCmdState : defenseCmdState;
    const steps = mode === 'offense' ? OFFENSE_STEPS : DEFENSE_STEPS;
    state.order = shuffledIndices(steps.length);
    state.solved = new Set();
    state.attempts = 0;
    state.hintShown = false;
    state.initialized = true;
  }

  function renderCmdListHTML(mode) {
    const state = mode === 'offense' ? offenseCmdState : defenseCmdState;
    const steps = mode === 'offense' ? OFFENSE_STEPS : DEFENSE_STEPS;
    if (!state.initialized) ensureCmdOrderInit(mode);
    const solvedInOrder = [...state.solved].sort((a, b) => a - b);
    const unsolved = state.order.filter(idx => !state.solved.has(idx));
    return solvedInOrder.concat(unsolved).map(idx => {
      const cmd = steps[idx].command;
      const solved = state.solved.has(idx);
      return `<div class="cmd-list-item${solved ? ' solved' : ''}" data-cmd="${cmd}"><i class="fas fa-angle-right"></i><span>${cmd}</span></div>`;
    }).join('');
  }

  // Full list of every real command that exists in the current mode's command bank
  // (used to tell "wrong but a real command" apart from "not a command at all").
  function getAllCommands(mode) {
    const steps = mode === 'offense' ? OFFENSE_STEPS : DEFENSE_STEPS;
    return steps.filter(s => s.type === 'command').map(s => s.command);
  }

  function markCommandSolved(mode, cmd) {
    const state = mode === 'offense' ? offenseCmdState : defenseCmdState;
    const steps = mode === 'offense' ? OFFENSE_STEPS : DEFENSE_STEPS;
    const idx = steps.findIndex(s => s.command === cmd);
    if (idx === -1) return;
    state.solved.add(idx);
  }

  function flashHintCommand(correctCmd) {
    const cmdListEl = document.getElementById('cmdList');
    if (!cmdListEl) return;
    cmdListEl.querySelectorAll('.cmd-list-item').forEach(item => {
      if (item.getAttribute('data-cmd') === correctCmd) item.classList.add('hint-flash');
    });
  }

  // New submit flow: typing/clicking submits an attempt against the CURRENT step's
  // expected command. Wrong tries show "INVALID COMMAND" in the input; after 3 wrong
  // tries the correct command flashes in the list above as a hint.
  function wireCommandAttempt(expectedCmd, btnId, mode, onSuccess) {
    const input = document.getElementById('cmdInput');
    const btn = document.getElementById(btnId);
    if (!input || !btn) return;
    const state = mode === 'offense' ? offenseCmdState : defenseCmdState;

    function trySubmit() {
      const typed = input.value.trim();
      if (!typed || input.readOnly) return;
      if (typed === expectedCmd) {
        markCommandSolved(mode, expectedCmd);
        state.attempts = 0;
        state.hintShown = false;
        input.classList.remove('cmd-invalid');
        onSuccess();
        return;
      }
      input.readOnly = true;
      input.classList.add('cmd-invalid');
      const isRealCommand = getAllCommands(mode).includes(typed);
      if (isRealCommand) {
        // A real command from the list, just not the right one for this step.
        input.value = 'INVALID COMMAND';
        state.attempts++;
        if (state.attempts >= 2 && !state.hintShown) {
          state.hintShown = true;
          flashHintCommand(expectedCmd);
        }
      } else {
        // Not a recognized command at all — doesn't count toward the 3-try hint,
        // so random guesses can't be used to fast-track the hint reveal.
        input.value = 'NOT IN LIST';
      }
      setTimeout(() => {
        input.value = '';
        input.classList.remove('cmd-invalid');
        input.readOnly = false;
        input.focus();
      }, 1400);
    }
    btn.addEventListener('click', trySubmit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });
  }

  
function wireCommandGate(expectedCmd, btnId) {
    const input = document.getElementById('cmdInput');
    const btn = document.getElementById(btnId);
    if (!input || !btn) return;
    btn.disabled = true;
    input.addEventListener('input', () => {
      if (input.value.trim() === expectedCmd) {
        input.classList.add('cmd-correct');
        btn.disabled = false;
      } else {
        input.classList.remove('cmd-correct');
        btn.disabled = true;
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !btn.disabled) btn.click();
    });
  }

  (function makeAppWindowDraggable() {
    const titlebar = appWindow.querySelector('.win-titlebar');
    let dragging = false, offX = 0, offY = 0;
    
    titlebar.addEventListener('pointerdown', (e) => {
      dragging = true;
      const winRect = appWindow.getBoundingClientRect();
      const mainRect = document.querySelector('main.layout').getBoundingClientRect();
      offX = e.clientX - winRect.left;
      offY = e.clientY - winRect.top;
      appWindow.style.left = (winRect.left - mainRect.left) + 'px';
      appWindow.style.top = (winRect.top - mainRect.top) + 'px';
      appWindow.style.transform = 'none';
      titlebar.setPointerCapture(e.pointerId);
    });
    
    titlebar.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const mainRect = document.querySelector('main.layout').getBoundingClientRect();
      const winW = appWindow.offsetWidth, winH = appWindow.offsetHeight;
      let nx = e.clientX - mainRect.left - offX;
      let ny = e.clientY - mainRect.top - offY;
      nx = Math.max(0, Math.min(mainRect.width - winW, nx));
      ny = Math.max(0, Math.min(mainRect.height - winH, ny));
      appWindow.style.left = nx + 'px';
      appWindow.style.top = ny + 'px';
    });
    
    function endDrag(e) { 
      if (dragging) {
        dragging = false;
      }
    }
    titlebar.addEventListener('pointerup', endDrag);
    titlebar.addEventListener('pointercancel', endDrag);
  })();

  function midOf(keyA, keyB) {
    return () => {
      const a = nodes[keyA], b = nodes[keyB];
      if (!a || !b) return null;
      return new THREE.Vector3((a.position.x + b.position.x) / 2, 1.7, (a.position.z + b.position.z) / 2);
    };

  function posOf(key) {
    return () => nodes[key] ? new THREE.Vector3(nodes[key].position.x, 1.7, nodes[key].position.z) : null;

    quizScore = 0;
    quizCompleted = false;
    renderQuizStep();
  }

  function renderQuizStep() {
    const mcqCount = quizMCQs.length;
    const matchingStepIndex = mcqCount;
    const shortStartIndex = mcqCount + 1;
    const shortEndIndex = shortStartIndex + quizShortQuestions.length;
    if (quizStepIndex < mcqCount) renderQuizMCQ(quizStepIndex);
    else if (quizStepIndex === matchingStepIndex) renderQuizMatching();
    else if (quizStepIndex < shortEndIndex) renderQuizShortAnswer(quizStepIndex - shortStartIndex);
    else renderQuizResults();
  }

  function renderQuizMCQ(idx) {
    const item = quizMCQs[idx];
    openWin(`<i class="fas fa-clipboard-question"></i>Cyber Test ${idx + 1}/${quizMCQs.length}`);
    const optsHtml = Object.keys(item.options).map(letter =>
      `<button class="quiz-opt" data-action="quiz-select" data-letter="${letter}">${letter}. ${item.options[letter]}</button>`
    ).join('');
    appWinBody.innerHTML = `
      <div class="quiz-progress">Question ${idx + 1} of ${quizMCQs.length}</div>
      <div class="quiz-question"><i class="fas fa-circle-question"></i> ${item.q}</div>
      <div class="quiz-options" id="quizOptionsWrap">${optsHtml}</div>`;
  }

  function handleQuizSelect(letter) {
    const idx = quizStepIndex;
    if (quizMcqAnswers[idx] !== null) return;
    quizMcqAnswers[idx] = letter;
    const correct = quizMCQs[idx].answer;
    const wrap = document.getElementById('quizOptionsWrap');
    if (!wrap) return;
    [...wrap.children].forEach(btn => {
      btn.classList.add('disabled');
      if (btn.dataset.letter === correct) btn.classList.add('correct');
      else if (btn.dataset.letter === letter) btn.classList.add('wrong');
    });
    if (letter === correct) quizScore++;
    const nextBtn = document.createElement('button');
    nextBtn.className = 'win-btn win-target';
    nextBtn.dataset.action = 'quiz-next';
    nextBtn.style.marginTop = '8px';
    nextBtn.innerHTML = (idx < quizMCQs.length - 1) ? 'Next Question <i class="fas fa-arrow-right"></i>' : 'Continue to Matching <i class="fas fa-arrow-right"></i>';
    appWinBody.appendChild(nextBtn);
  }

  function renderQuizMatching() {
    openWin('<i class="fas fa-link"></i>Cyber Test — Matching');
    const bLetters = Object.keys(quizMatchingB);
    const rowsHtml = quizMatchingA.map((label, i) => `
      <div class="match-row">
        <span class="match-num">${i + 1}.</span>
        <span class="match-label">${label}</span>
        <div class="match-dropzone" data-row="${i}">Drop here</div>
      </div>`).join('');
    const chipsHtml = bLetters.map(l => `<div class="match-chip" draggable="true" data-letter="${l}">${l}. ${quizMatchingB[l]}</div>`).join('');
    appWinBody.innerHTML = `
      <div class="quiz-question"><i class="fas fa-link"></i> Match each item in Column A to its answer.</div>
      <div class="match-list">${rowsHtml}</div>
      <div class="match-pool-title"><i class="fas fa-hand-pointer"></i> Drag the correct match into each box</div>
      <div class="match-pool" id="matchPool">${chipsHtml}</div>`;
    wireMatchingDragDrop();
  }

  function wireChipDrag(chip) {
    chip.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', chip.dataset.letter);
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
  }

  function wireMatchingDragDrop() {
    appWinBody.querySelectorAll('.match-chip').forEach(wireChipDrag);
    appWinBody.querySelectorAll('.match-dropzone').forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        if (zone.classList.contains('correct') || zone.classList.contains('wrong')) return;
        e.preventDefault();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (zone.classList.contains('correct') || zone.classList.contains('wrong')) return;
        const letter = e.dataTransfer.getData('text/plain');
        if (letter) placeMatchInZone(zone, letter);
      });
    });
  }

  function placeMatchInZone(zone, letter) {
    if (zone.classList.contains('correct') || zone.classList.contains('wrong')) return;
    const chip = appWinBody.querySelector(`.match-chip[data-letter="${letter}"]`);
    if (chip) chip.remove();
    const i = parseInt(zone.dataset.row, 10);
    quizMatchingAnswers[i] = letter;
    const isCorrect = letter === quizMatchingAnswer[i];
    zone.dataset.letter = letter;
    zone.textContent = isCorrect ? 'YES' : 'NO';
    zone.classList.add(isCorrect ? 'correct' : 'wrong');
    if (isCorrect) quizScore++;
    checkMatchingComplete();
  }

  function checkMatchingComplete() {
    const zones = appWinBody.querySelectorAll('.match-dropzone');
    const allGraded = [...zones].every(z => z.classList.contains('correct') || z.classList.contains('wrong'));
    if (!allGraded) return;
    const pool = document.getElementById('matchPool');
    if (pool) pool.innerHTML = '';
    if (!appWinBody.querySelector('[data-action="quiz-next"]')) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'win-btn win-target';
      nextBtn.dataset.action = 'quiz-next';
      nextBtn.style.marginTop = '8px';
      nextBtn.innerHTML = 'Continue to Short Answer <i class="fas fa-arrow-right"></i>';
      appWinBody.appendChild(nextBtn);
    }
  }

  function renderQuizShortAnswer(idx) {
    openWin(`<i class="fas fa-pen-to-square"></i>Cyber Test — Short Answer ${idx + 1}/${quizShortQuestions.length}`);
    appWinBody.innerHTML = `
      <div class="quiz-progress">Short Answer ${idx + 1} of ${quizShortQuestions.length}</div>
      <div class="quiz-question"><i class="fas fa-pen-to-square"></i> ${quizShortQuestions[idx]}</div>
      <textarea class="quiz-textarea" id="quizShortInput" placeholder="Type your answer here..."></textarea>
      <button class="win-btn win-safe" data-action="quiz-submit-short">${idx < quizShortQuestions.length - 1 ? 'Next Question' : 'Submit &amp; See Results'}</button>`;
  }

  function submitShortAnswer() {
    const mcqCount = quizMCQs.length;
    const shortStartIndex = mcqCount + 1;
    const idx = quizStepIndex - shortStartIndex;
    const ta = document.getElementById('quizShortInput');
    quizShortAnswers[idx] = ta ? ta.value.trim() : '';
    quizStepIndex++;
    renderQuizStep();
  }

  function renderQuizResults() {
    quizCompleted = true;
    openWin('<i class="fas fa-trophy"></i>Cyber Test — Results');
    let msg = 'Keep practicing — review the lab once more.';
    if (quizScore >= Math.ceil(quizTotalPoints * 0.85)) msg = 'Excellent! You spotted the red flags.';
    else if (quizScore >= Math.ceil(quizTotalPoints * 0.6)) msg = 'Good job — a solid understanding.';
    appWinBody.innerHTML = `
      <div class="quiz-score"><i class="fas fa-trophy"></i> Score: ${quizScore} / ${quizTotalPoints}</div>
      <div class="quiz-score-sub">${msg}</div>
      <button class="win-btn" data-action="quiz-retry" style="border-color:var(--ok); color:var(--ok);"><i class="fas fa-rotate-left" style="margin-right:5px;"></i>Retry Test</button>
      <div style="font-size:7px;color:var(--muted-2);margin-top:6px;">Closing in 3s if Retry isn't clicked...</div>`;
    clearTimeout(quizAutoCloseTimer);
    quizAutoCloseTimer = setTimeout(() => {
      closeWin();
      showCertificateModal();
    }, 3000);
  }

  // ---- begin / reset ----
  function beginActivity() {
    stage = 1;
    securityScore = 100;
    exfilKB = 0;
    actionBtn.style.display = 'none';
    setSecurity(100, 'linear-gradient(90deg,#22c55e,#8de8c9)');
    statExfil.textContent = '0 / ' + TOTAL_OFFENSE_STAGES;
    statInfected.textContent = '0 / 2';
    setStatusBadge('SECURE', '');
    updateStageChrome();
    ensureCmdOrderInit('offense');
    setTimeout(renderCurrentWindow, 300);
  }

  function prepareWaitingState() {
    actionBtn.style.display = 'flex';

    actionBtn.textContent = 'Start';

    statInfected.textContent = '0 / 2';
    statExfil.textContent = '0 KB';
    setSecurity(100, 'linear-gradient(90deg,#22c55e,#8de8c9)');

  function clearAllObjects3D(preserveFeed) {
    Object.keys(nodes).forEach(k => { if (nodes[k]) { scene.remove(nodes[k]); delete nodes[k]; } });
    if (attackerLight) { scene.remove(attackerLight); attackerLight = null; }
    targetLightMat = null;
    if (breachIcon) { scene.remove(breachIcon); breachIcon = null; }
    clear3DLines(preserveFeed);
  }

  // ---- PDF / Certificate ----
  function formatCertDateTime() {
    const now = new Date();
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    return `${dateStr}  •  ${timeStr}`;
  }

  let CERT_LAB_TITLE = 'Loading Lab…';
  function sanitizeCertTitle(title) {
    return title.toUpperCase().replace(/\bATTACK\b\s*/g, '').replace(/\s{2,}/g, ' ').trim();
  }

  // The certificate background image lives alongside this lab in LabImages/certbg.png
  // (no more giant inline base64/SVG blob — just a normal external image reference).
  const CERT_BG_DATA_URL = "LabImages/certbg.png";

  function showCertificateModal() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box certificate-modal">
        <div class="cert-top-bar">
          <div class="cert-lab-title">${sanitizeCertTitle(CERT_LAB_TITLE)}</div>
          <div class="cert-student-inline">
            <span class="cert-item"><b>Name:</b> ${studentName}</span>
            <span class="cert-item"><b>ID:</b> ${studentId}</span>
            <span class="cert-item"><b>Grade:</b> ${studentGrade}</span>
          </div>
          <div class="cert-datetime">${formatCertDateTime()}</div>
        </div>
        <div class="cert-bottom-bar">
          <button class="cert-btn" id="certPdfBtn">📄 Download Lab Report (PDF)</button>
          <button class="cert-btn" id="certImgBtn">🏆 Download Certificate</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    const certBox = overlay.querySelector('.certificate-modal');
    certBox.style.backgroundImage = `url('${CERT_BG_DATA_URL}')`;
    const pdfBtnEl = overlay.querySelector('#certPdfBtn');
    const certBtnEl = overlay.querySelector('#certImgBtn');
    pdfBtnEl.addEventListener('click', () => generatePDF(studentName, studentId, studentGrade, pdfBtnEl));
    certBtnEl.addEventListener('click', () => downloadCertificate(certBtnEl));
  }

  let _certBgImgEl = null;
  function loadCertBgImageEl() {
    return new Promise((resolve, reject) => {
      if (_certBgImgEl) { resolve(_certBgImgEl); return; }
      const img = new Image();
      img.onload = () => { _certBgImgEl = img; resolve(img); };
      img.onerror = reject;
      img.src = CERT_BG_DATA_URL;
    });
  }

  async function downloadCertificateImagePng() {
    const imgEl = await loadCertBgImageEl();
    const scale = 2;
    const w = (imgEl.naturalWidth || 1536) * scale, h = (imgEl.naturalHeight || 1024) * scale;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0, w, h);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#0f4c81';
    ctx.font = `600 ${Math.round(h * 0.026)}px Arial, sans-serif`;
    ctx.fillText(`Name: ${studentName}      ID: ${studentId}      Grade: ${studentGrade}`, w / 2, h * 0.135);
    ctx.fillStyle = '#5a6478';
    ctx.font = `${Math.round(h * 0.018)}px Arial, sans-serif`;
    ctx.fillText(formatCertDateTime(), w / 2, h * 0.135 + h * 0.03);
    ctx.fillStyle = '#0f4c81';
    ctx.font = `bold ${Math.round(h * 0.026 + h * 0.008)}px Arial, sans-serif`;
    ctx.fillText(sanitizeCertTitle(CERT_LAB_TITLE), w / 2, h * 0.135 + h * 0.03 + h * 0.032);

    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    const safeName = (studentName || 'certificate').replace(/[^a-z0-9]+/gi, '_');
    link.download = `Certificate_${safeName}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  async function downloadCertificatePDF() {
    const imgEl = await loadCertBgImageEl();
    const { jsPDF } = window.jspdf;
    const pageW = 720, pageH = Math.round(pageW * (1024 / 1536));
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [pageW, pageH] });
    doc.addImage(imgEl, 'PNG', 0, 0, pageW, pageH);

    const y = pageH * 0.135;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(15, 76, 129);
    doc.text(`Name: ${studentName}      ID: ${studentId}      Grade: ${studentGrade}`, pageW / 2, y, { align: 'center' });
    doc.setFontSize(10); doc.setTextColor(90, 100, 120);
    doc.text(formatCertDateTime(), pageW / 2, y + 18, { align: 'center' });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13 + 4); doc.setTextColor(15, 76, 129);
    doc.text(sanitizeCertTitle(CERT_LAB_TITLE), pageW / 2, y + 18 + 22, { align: 'center' });

    const safeName = (studentName || 'certificate').replace(/[^a-z0-9]+/gi, '_');
    doc.save(`Certificate_${safeName}.pdf`);
  }

  async function downloadCertificate(triggerBtn) {
    const originalLabel = triggerBtn ? triggerBtn.textContent : '';
    if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = 'Generating…'; }
    try {
      await downloadCertificateImagePng();
    } catch (imgErr) {
      console.warn('Certificate PNG download failed, falling back to PDF:', imgErr);
      try {
        await downloadCertificatePDF();
      } catch (pdfErr) {
        console.error('Certificate PDF fallback also failed:', pdfErr);
        alert('Something went wrong downloading the certificate. Please try again.');
      }
    } finally {
      if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = originalLabel; }
    }
  }
