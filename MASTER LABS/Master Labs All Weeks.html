  let _pdfBgPngCache = null;
  function loadPdfBgPng(pxW, pxH) {
    return new Promise((resolve, reject) => {
      if (_pdfBgPngCache) { resolve(_pdfBgPngCache); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = pxW; canvas.height = pxH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, pxW, pxH);
        _pdfBgPngCache = canvas.toDataURL('image/png');
        resolve(_pdfBgPngCache);
      };
      img.onerror = reject;
      img.src = PDF_BG_SVG_DATAURL;
    });
  }

  async function generatePDF(name, id, grade, triggerBtn) {
    const originalLabel = triggerBtn ? triggerBtn.textContent : '';
    if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = 'Generating PDF…'; }
    try {
      let shots = stepScreenshots;
      if (!shots.length) {
        const canvas = await html2canvas(document.querySelector('.app'), { backgroundColor: '#0a0f1c', scale: 1.5, useCORS: true, ignoreElements: (el) => el.id === 'appWindow' });
        shots = [{ label: 'Defense Complete', dataUrl: canvas.toDataURL('image/png') }];
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
      const margin = 48;

      const bgPng = await loadPdfBgPng(Math.round(pageW * 2), Math.round(pageH * 2));
      const drawBg = () => doc.addImage(bgPng, 'PNG', 0, 0, pageW, pageH);
      drawBg();

      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(18, 26, 43);
      doc.text('Cyber Defense Lab', margin, 62, { maxWidth: pageW - margin*2 });

      doc.setDrawColor(255, 59, 92); doc.setLineWidth(1.5);
      doc.line(margin, 80, pageW - margin, 80);

      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString();

      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(90, 100, 120);
      doc.text('Date: ' + dateStr, margin, 102);
      doc.text('Time: ' + timeStr, pageW - margin, 102, { align: 'right' });

      doc.setDrawColor(210, 210, 210); doc.setLineWidth(0.75);
      doc.roundedRect(margin, 118, pageW - margin*2, 64, 6, 6);

      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30, 40, 60);
      doc.text('STUDENT NAME:', margin + 16, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(name, margin + 112, 140, { maxWidth: 185 });
      doc.setFont('helvetica', 'bold');
      doc.text('ID:', margin + 300, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(id, margin + 322, 140, { maxWidth: 48 });
      doc.setFont('helvetica', 'bold');
      doc.text('GRADE:', margin + 372, 140);
      doc.setFont('helvetica', 'normal');
      doc.text(grade, margin + 426, 140, { maxWidth: 73 });

      doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(20, 140, 110);
      doc.text('Cyber Lab: Completed', margin + 16, 166);
      if (quizCompleted) { doc.setTextColor(20, 140, 110); doc.text('Cyber Test: Points ' + quizScore + ' out of ' + quizTotalPoints, margin + 300, 166); }
      else { doc.setTextColor(160, 70, 70); doc.text('Cyber Test: Not Completed', margin + 300, 166); }

      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(18, 26, 43);
      doc.text('Scenario Overview', margin, 212);

      const scenario = "This lab walks through a Social Engineering scenario, staged on an interactive 3D tabletop that the student assembled themselves from a toolbox of real object icons.\n\nIn the Offense module, an Outsider targets a company employee: identifying the target, studying their behavior, building trust by posing as a vendor, creating urgency, using pretexting to request account information, manipulating the employee into complying, and using impersonation to obtain access to a restricted company area.\n\nIn the Defense module, the company's security team -- the Security Analyst, Security Officer, Access Manager, Employee, and Training Officer -- responds to what was found: detecting the suspicious behavior, verifying identity, blocking the contact, restricting the requested access, reporting the incident, and training and testing employees to recognize manipulation, pretexting, urgency, and impersonation.\n\nThe following pages show a screenshot captured at the end of every stage, documenting the student's progress through the full lab.";

      doc.setFontSize(9); doc.setTextColor(150, 150, 150);
      doc.text('Social Engineering Lab — Educational Cyber Lab', margin, pageH - 30);

      doc.setFont('times', 'normal'); doc.setFontSize(16); doc.setTextColor(60, 70, 90);
      const scenarioMaxW = pageW - margin*2;
      const wrapped = doc.splitTextToSize(scenario, scenarioMaxW);
      const scenarioLineHeight = 16 * 1.15;
      const scenarioBottomLimit = pageH - 50;
      let scenarioY = 234;
      wrapped.forEach((line, idx) => {
        if (scenarioY > scenarioBottomLimit) { doc.addPage(); drawBg(); scenarioY = margin; }
        const nextLine = wrapped[idx + 1];
        const isLastLineOfParagraph = (line.trim() === '') || nextLine === undefined || nextLine.trim() === '';
        if (line.trim() !== '') {
          if (isLastLineOfParagraph) {
            doc.text(line, margin, scenarioY, { maxWidth: scenarioMaxW });
          } else {
            doc.text(line, margin, scenarioY, { maxWidth: scenarioMaxW, align: 'justify' });
          }
        }
        scenarioY += scenarioLineHeight;
      });

      const maxW = pageW - margin*2, labelH = 14, gap = 10, perPage = 3;
      const availableH = pageH - margin*2;
      const slotH = (availableH - perPage*labelH - perPage*gap) / perPage;
      let cursorY = margin, countOnPage = 0;

      shots.forEach((step) => {
        if (countOnPage === 0) { doc.addPage(); drawBg(); cursorY = margin; }
        const imgProps = doc.getImageProperties(step.dataUrl);
        let w = maxW, h = (imgProps.height * w) / imgProps.width;
        if (h > slotH) { h = slotH; w = (imgProps.width * h) / imgProps.height; }
        const x = margin + (maxW - w) / 2;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(18, 26, 43);
        doc.text(step.label, margin, cursorY + 10);
        doc.addImage(step.dataUrl, 'PNG', x, cursorY + labelH, w, h);
        cursorY += labelH + slotH + gap;
        countOnPage = (countOnPage + 1) % perPage;
      });

      // ---- Cyber Test section (continues right below the last screenshot) ----
      const qMaxW = pageW - margin * 2;
      let qy = cursorY + 4;
      if (qy > pageH - 140) { doc.addPage(); drawBg(); qy = margin; }

      doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(18, 26, 43);
      doc.text('Cyber Test — Knowledge Check', margin, qy);
      qy += 22;

      if (quizCompleted) {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(20, 140, 110);
        doc.text('Score: ' + quizScore + ' / ' + quizTotalPoints, margin, qy);
      } else {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(10.5); doc.setTextColor(160, 70, 70);
        doc.text('The Cyber Test was not completed in this session.', margin, qy);
      }
      qy += 22;

      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(18, 26, 43);
      doc.text('Multiple Choice Questions', margin, qy);
      qy += 16;

      quizMCQs.forEach((item, i) => {
        if (qy > pageH - 70) { doc.addPage(); drawBg(); qy = margin; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30, 40, 60);
        const qLines = doc.splitTextToSize((i + 1) + '. ' + item.q, qMaxW);
        doc.text(qLines, margin, qy);
        qy += qLines.length * 13 + 4;

        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
        let cursorX = margin + 10;
        const optGap = 16;
        Object.keys(item.options).forEach(letter => {
          const isCorrect = letter === item.answer;
          const isChosen = quizMcqAnswers[i] === letter;
          let label = letter + '. ' + item.options[letter];
          if (isCorrect) { doc.setTextColor(20, 140, 110); label += ' (Correct)'; }
          else if (isChosen) { doc.setTextColor(200, 60, 70); label += ' (Your Answer)'; }
          else { doc.setTextColor(80, 90, 110); }
          const w = doc.getTextWidth(label);
          if (cursorX + w > pageW - margin) { cursorX = margin + 10; qy += 13; }
          doc.text(label, cursorX, qy);
          cursorX += w + optGap;
        });
        qy += 12;
        doc.setDrawColor(215, 222, 232); doc.setLineWidth(0.5);
        doc.line(margin, qy, pageW - margin, qy);
        qy += 12;
      });

      if (qy > pageH - 100) { doc.addPage(); drawBg(); qy = margin; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(18, 26, 43);
      doc.text('Matching', margin, qy);
      qy += 16;

      quizMatchingA.forEach((label, i) => {
        if (qy > pageH - 45) { doc.addPage(); drawBg(); qy = margin; }
        const correctLetter = quizMatchingAnswer[i];
        const chosen = quizMatchingAnswers[i];
        let line = (i + 1) + '. ' + label + '  ->  Correct: ' + correctLetter + '. ' + quizMatchingB[correctLetter];
        if (chosen) {
          line += '   |   Your answer: ' + chosen + (chosen === correctLetter ? ' (Correct)' : ' (Incorrect)');
        }
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
        if (chosen === correctLetter) doc.setTextColor(20, 140, 110);
        else if (chosen) doc.setTextColor(200, 60, 70);
        else doc.setTextColor(80, 90, 110);
        const lineWrapped = doc.splitTextToSize(line, qMaxW);
        doc.text(lineWrapped, margin, qy);
        qy += lineWrapped.length * 13 + 8;
        doc.setDrawColor(215, 222, 232); doc.setLineWidth(0.5);
        doc.line(margin, qy, pageW - margin, qy);
        qy += 12;
      });

      if (qy > pageH - 100) { doc.addPage(); drawBg(); qy = margin; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(18, 26, 43);
      doc.text('Short Answer', margin, qy);
      qy += 16;

      quizShortQuestions.forEach((q, i) => {
        if (qy > pageH - 60) { doc.addPage(); drawBg(); qy = margin; }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(30, 40, 60);
        const saQLines = doc.splitTextToSize((i + 1) + '. Q: ' + q, qMaxW);
        doc.text(saQLines, margin, qy);
        qy += saQLines.length * 13 + 4;

        doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(70, 80, 100);
        const answerText = quizShortAnswers[i] ? quizShortAnswers[i] : '(No answer provided)';
        const saALines = doc.splitTextToSize('A: ' + answerText, qMaxW);
        if (qy + saALines.length * 13 > pageH - margin) { doc.addPage(); drawBg(); qy = margin; }
        doc.text(saALines, margin, qy);
        qy += saALines.length * 13 + 10;
      });

      doc.save('Cybersecurity_Principles_Lab_Report_' + name.replace(/\s+/g, '_') + '.pdf');
    } catch (err) {
      console.error(err);
      alert('Something went wrong generating the PDF. Please try again.');
    } finally {
      if (triggerBtn) { triggerBtn.disabled = false; triggerBtn.textContent = originalLabel; }
    }
  }

    adminMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      adminMenu.classList.toggle('open');
    });
  }
  document.addEventListener('click', (e) => {
    if (adminMenu && !adminMenu.contains(e.target)) adminMenu.classList.remove('open');
  });
  if (sendFeedbackBtn) {
    sendFeedbackBtn.addEventListener('click', () => {
      adminMenu.classList.remove('open');
      showFeedbackModal();
    });
  }

  // ---- Cybersecurity Principles Lab content overrides ----
  function placeRequiredObject(need) { spawnToolNode(need.type); }
  function placeDefenseObject(need) { spawnToolNode(need.type); }

  function midPosOf(fromKey, toKey) {
    return () => {
      const a = nodes[fromKey], b = nodes[toKey];
      if (!a || !b) return null;
      return new THREE.Vector3((a.position.x + b.position.x) / 2, 2.6, (a.position.z + b.position.z) / 2);
    };
  }

  function animateGenericStep(fromKey, toKeyOrKeys, isDefense, feedLabel) {
    // toKeyOrKeys may be a single key (string) or an array of keys — a merged/combined
    // command touches multiple devices, so every target gets its own staggered
    // pulse+ripple+line+feed entry within the same command execution.
    const toKeys = (Array.isArray(toKeyOrKeys) ? toKeyOrKeys : [toKeyOrKeys]).filter(Boolean);
    const labels = feedLabel ? feedLabel.split(' & ') : [];
    const seqSteps = toKeys.map((toKey, idx) => {
      const def = TOOL_DEFS[toKey];
      const hasLine = !!(nodes[fromKey] && nodes[toKey]);
      const label = labels[idx] || feedLabel || (def ? def.name + (isDefense ? ' Secured' : ' Checked') : 'Step');
      return {
        delay: idx * 500,
        label: label,
        cls: isDefense ? 'safe' : 'unsafe',
        getPos: hasLine ? midPosOf(fromKey, toKey) : posOf(toKey),
        line: hasLine ? { fromKey, toKey, safe: !!isDefense, duration: 1600 } : undefined,
        onStart: () => { if (nodes[toKey] && def) { popPulseSprite(nodes[toKey], def.w, def.h, 900, 0.3); spawnRipple(toolNodePos(toKey), isDefense ? 0x22d3a6 : 0xff6a3d, 1100); } }
      };
    });
    playSequence(seqSteps);
  }

  function renderCurrentWindow() {
    if (stage < 1 || stage > TOTAL_OFFENSE_STAGES + 1) { closeWin(); return; }
    let html = '';

    if (stage >= 1 && stage <= TOTAL_OFFENSE_STAGES) {
      const s = OFFENSE_STEPS[stage - 1];
      openWin(`⚡ Offense Mode ⚡
`);
      const interactionHTML = s.type === 'click'
        ? buildClickInfoHTML(s.explain) + buildClickActionHTML(TOOL_DEFS[s.tool].emoji, 'Offense Terminal', 'winStepBtn', s.clickLabel)
        : `
          <div class="win-msg cmd-test-label"><b>Test Command Center</b></div>
          <div class="cmd-list" id="cmdList">${renderCmdListHTML('offense')}</div>
          <div class="win-cmd-explain">${s.explain}</div>
          <div class="appwin-spacer"></div>
          ${buildDesktopTerminalHTML('Offense Terminal', 'winStepBtn', s.title, false)}
        `;
      html += `
      <div class="offense-appwin">
<div class="win-msg" style="text-align:left; line-height: 1.3;">
    <b style="color: #ffffff;">Step ${stage}:</b> 
    <b style="color: #ffffff;">Actor:</b> 
    <span style="color: #ffffff;">${s.actorLabel}</span>
    <b style="color: #ffffff;">Tool:</b> 
    <span style="color: #ffffff;">${s.toolLabels.join(' + ')}</span>
    <b style="color: #ffffff;">Topic:</b> 
    <span style="color: #ffffff;">${s.subtopic}</span>
</div>
    ${interactionHTML}
</div>`;
    } else if (stage === TOTAL_OFFENSE_STAGES + 1) {
      openWin(`<i class="fas fa-user-secret"></i>Offense Terminal`);
      html += `
        <div class="offense-appwin">
          <div class="win-msg" style="font-family:var(--mono); font-size:13px; font-weight:800; color:#39ff6a !important; line-height:1.35; text-align:left;">The intrusion is complete — but the job isn't done. Now it's time to switch roles and respond the way a real security team would.</div>
          ${OFFENSE_COMPLETION_TEXT}
          <button class="win-btn success" id="winDefendBtn"><i class="fas fa-shield-halved" style="margin-right:6px;"></i>NETWORK DEFENSE</button>
        </div>`;
    }

    appWinBody.innerHTML = html;

    if (stage >= 1 && stage <= TOTAL_OFFENSE_STAGES) {
      const s = OFFENSE_STEPS[stage - 1];
      const advance = () => {
        animateGenericStep('outsider', s.tools, false, s.activityLog);
        showFlashCard('🔎', s.title, s.dashboard || s.explain, 2400);
        statExfil.textContent = stage + ' / ' + TOTAL_OFFENSE_STAGES;
        if (stage < TOTAL_OFFENSE_STAGES) {
          goToStage(stage + 1, null, null, 1300);
        } else {
          closeWin();
          setTimeout(offerNetworkDefense, 1600);
        }
      };
      if (s.type === 'command') {
        wireCommandAttempt(s.command, 'winStepBtn', 'offense', advance);
      } else {
        const b = document.getElementById('winStepBtn');
        if (b) b.addEventListener('click', advance);
      }
    } else if (stage === TOTAL_OFFENSE_STAGES + 1) {
      const b = document.getElementById('winDefendBtn');
      if (b) b.addEventListener('click', () => { closeWin(); startDefenseModule(); });
    }
  }

  function offerNetworkDefense() {
    captureStep('Stage ' + TOTAL_OFFENSE_STAGES + ' — Investigation Complete');
    closeWin();
    setTimeout(() => {
      stage = TOTAL_OFFENSE_STAGES + 1;
      updateStageChrome();
      renderCurrentWindow();
    }, 380);
  }

  function startDefenseModule() {
    if (defenseActive) return;
    closeWin();
    clearInterval(exfilTimer);
    clearAllObjects3D(true);
    defenseActive = true;
    defenseFullQueue = requiredQueue.concat(NEW_DEFENSE_TOOLS);
    defenseSelectionIndex = 0;
    defenseSelectionComplete = false;
    defenseStage = 0;
    defenseComplete = false;
    isReporting = false;
    checkDefenseRunning = false;
    statExfil.textContent = '0 / ' + TOTAL_OFFENSE_STAGES;
    setSecurity(20, 'linear-gradient(90deg,#ff3b5c,#ff8095)');
    setStatusBadge('REBUILDING', '');
    if (flashStat) flashStat.classList.add('mode-defense');
    toolboxPanel.classList.add('defense-mode');
    renderToolbox();
    updateToolboxPrompt();
    ensureCmdOrderInit('defense');
    showFlashCard('🛡️', 'Defense Mode', 'The stage is clear — rebuild the network, then deploy your defenses to protect it.', 3200);
  }

  function updateDefenseWindow() {
    if (!defenseActive) return;
    if (!defenseSelectionComplete) {
      appWinBody.innerHTML = `
        <div class="defense-appwin">
          <div class="win-msg">Deploy your defensive toolkit using the toolbox on the left before remediation can begin.</div>
          <div class="win-card"><div class="win-msg"><b>Objects placed:</b> ${defenseSelectionIndex} / ${defenseFullQueue.length}</div></div>
        </div>`;
      return;
    }
    if (defenseStage >= 1 && defenseStage <= TOTAL_DEFENSE_STAGES) {
      const s = DEFENSE_STEPS[defenseStage - 1];
      const busy = isReporting;
      const btnId = 'winDefStepBtn';
      const interactionHTML = s.type === 'click'
        ? buildClickInfoHTML(s.explain) + buildClickActionHTML(TOOL_DEFS[s.tool].emoji, 'Defense Terminal', btnId, busy ? s.title + '…' : s.clickLabel, busy)
        : `
          <div class="win-msg cmd-test-label"><b>Test Command Center</b></div>
          <div class="cmd-list" id="cmdList">${renderCmdListHTML('defense')}</div>
          <div class="win-cmd-explain">${s.explain}</div>
          <div class="appwin-spacer"></div>
          ${buildDesktopTerminalHTML('Defense Terminal', btnId, busy ? s.title + '…' : s.title, busy)}
        `;
      appWinBody.innerHTML = `
        <div class="defense-appwin">
    <div class="win-msg" style="text-align:left; line-height: 1.3; color: #22d3a6; font-weight: bold;">
        <b>Step ${defenseStage} — ${s.title}</b>
    </div>
    <div class="step-explain" style="text-align:left; line-height: 1.3; color: #22d3a6; font-weight: bold;">
        Actor: ${s.actorLabel} &nbsp;|&nbsp; Tool: ${s.toolLabels.join(' + ')}
    </div>
    ${interactionHTML}
</div>`;
      if (!busy) {
        if (s.type === 'command') {
          wireCommandAttempt(s.command, btnId, 'defense', () => runDefenseStep(document.getElementById(btnId)));
        } else {
          const btn = document.getElementById(btnId);
          if (btn) btn.addEventListener('click', () => runDefenseStep(btn));
        }
      }
    } else if (defenseStage === TOTAL_DEFENSE_STAGES + 1) {
      appWinBody.innerHTML = `
        <div class="defense-appwin">
          <div class="win-msg"><b>🛡️ Defense Complete</b></div>
          <div class="win-card"style="font-size:16px;"><div class="win-msg" style="font-size:14px;">The threat has been fully addressed.</div></div>
          ${DEFENSE_COMPLETION_TEXT}
          <button class="win-btn success" id="winCheckDefenseBtn"><i class="fas fa-check-double" style="margin-right:6px;"></i>Check Defense</button>
        </div>`;
      const cb = document.getElementById('winCheckDefenseBtn');
      if (cb) cb.addEventListener('click', () => { cb.disabled = true; cb.textContent = 'Verifying…'; runCheckDefense(); });
    }
  }

  function runDefenseStep(triggerBtn) {
    if (isReporting) return;
    isReporting = true;
    if (triggerBtn) { triggerBtn.disabled = true; triggerBtn.textContent = 'Applying…'; }
    const s = DEFENSE_STEPS[defenseStage - 1];
    animateGenericStep('defterm', s.tools, true, s.activityLog);
    showFlashCard('🛡️', s.title, s.dashboard || s.explain, 2600);
    setTimeout(() => {
      isReporting = false;
      captureStep('Defense — ' + s.title);
      defenseStage++;
      if (defenseStage > TOTAL_DEFENSE_STAGES) {
        defenseComplete = true;
        setSecurity(100, 'linear-gradient(90deg,#22c55e,#8de8c9)');
        setStatusBadge('SECURED', '');
        showFlashCard('✅', 'Defense Complete', 'All defensive measures are in place. Run "Check Defense" to verify.', 4000);
      } else {
        setSecurity(Math.min(90, 20 + defenseStage * 8), 'linear-gradient(90deg,#ffb020,#8de8c9)');
      }
      closeWin();
      setTimeout(() => {
        openWin('<i class="fas fa-shield-halved"></i>Defense Terminal');
        updateDefenseWindow();
      }, 380);
    }, 1700);
  }

  function runCheckDefense() {
    if (checkDefenseRunning) return;
    checkDefenseRunning = true;
    showFlashCard('🔍', 'Verifying Defense', 'Simulating the original weaknesses against the new defenses…', 3000);
    setStatusBadge('TESTING', 'warn');
    const checkPairs = DEFENSE_STEPS.flatMap(s => (s.tools && s.tools.length ? s.tools : [s.tool]).map(t => ['defterm', t]));
    const steps = checkPairs.map((pair, i) => ({
      delay: 200 + i * 800,
      label: (TOOL_DEFS[pair[1]] ? TOOL_DEFS[pair[1]].name : pair[1]) + ' Verified',
      cls: 'safe',
      getPos: (nodes.defterm && nodes[pair[1]]) ? midPosOf('defterm', pair[1]) : (() => toolNodePos(pair[1])),
      line: (nodes.defterm && nodes[pair[1]]) ? { fromKey: 'defterm', toKey: pair[1], safe: true, duration: 900 } : undefined,
      onStart: () => { if (nodes[pair[1]]) { popPulse(nodes[pair[1]], 500, 0.28); spawnRipple(toolNodePos(pair[1]), 0x22d3a6, 900); } }
    }));
    playSequence(steps);
    setTimeout(() => {
      checkDefenseRunning = false;
      setStatusBadge('PROTECTED', '');
      setSecurity(100, 'linear-gradient(90deg,#22c55e,#8de8c9)');
      captureStep('Defense — Check Defense (Verified Secure)');
      showFlashCard('✅', 'Defense Verified', 'Every step was retested and blocked — the company is secure.', 5000);
      closeWin();
      setTimeout(() => {
        openWin('<i class="fas fa-shield-halved"></i>Defense Terminal');
        appWinBody.innerHTML = `
          <div class="defense-appwin">
            <div class="win-msg" style="color:var(--ok); font-weight:800; font-size:16px;">✅ Defense Successful</div>
            <div class="win-card"><div class="win-msg" style="font-family:var(--mono); font-size:13px; font-weight:800; color:#39ff6a !important; line-height:1.35; text-align:left;">Behavioral monitoring, identity verification, contact blocking, access restriction, incident reporting, and employee training all held up. The company stayed protected.</div></div>
            <button class="win-btn success" id="winCyberTestBtn"><i class="fas fa-flask" style="margin-right:6px;"></i>CYBER TEST</button>
          </div>`;
        const cyberTestGoBtn = document.getElementById('winCyberTestBtn');
        if (cyberTestGoBtn) cyberTestGoBtn.addEventListener('click', () => { defenseActive = false; startCyberTest(); });
      }, 380);
    }, 200 + checkPairs.length * 800 + 900);
  }

  // ---- JSON-driven lab loading ----
  const eyebrowEl = document.getElementById('eyebrowText');

  function buildNodeDef(label) {
    return { type: slugType(label), label: label };
  }

  // Builds requiredQueue (offense) / NEW_DEFENSE_TOOLS (defense-only) from the JSON's
  // offense/defense step arrays, deduping by first appearance and always anchoring the
  // scene on 'outsider' (offense) / synthetic 'defterm' hub (defense) — see toolNodePos()
  // and runDefenseStep()/runCheckDefense(), which pivot every animation off those two keys.
  function applyLabData(lab) {
    // 1) Title at the top of the page
    const pageTitle = lab.title || 'Cyber Defence Lab';
    if (eyebrowEl) eyebrowEl.textContent = 'CYBERSECURITY FOUNDATIONS: ' + pageTitle;
    document.title = pageTitle + ' — 3D Interactive Cyber Lab';
    CERT_LAB_TITLE = pageTitle;

    // 2) Scenario -> scenario modal (scenario-modal2)
    const scenario = lab.scenario || {};
    SCENARIO_TITLE = scenario.title || '';
    SCENARIO_DESCRIPTION_HTML = buildScenarioDescriptionHTML(scenario.description || '');

    // Offense/defense step arrays from JSON
    const offenseJsonSteps = (lab.offense && lab.offense.steps) || [];
    const defenseJsonSteps = (lab.defense && lab.defense.steps) || [];

    // A merged/combined command can touch multiple devices at once. Steps carry this as
    // a `tools` array (preferred) or, for backward compatibility with older exports, a
    // singular `tool` (+ optional `tool2`).
    function stepToolLabels(step) {
      if (Array.isArray(step.tools) && step.tools.length) return step.tools.filter(Boolean);
      return [step.tool, step.tool2].filter(Boolean);
    }

    // 4) requiredQueue: 'outsider' anchor + unique offense tools in first-seen order.
    // Every tool named by a step's `tools` array gets walked into the toolbox/scene so
    // all of a combined command's devices exist on stage for the animation.
    const seenTypes = new Set(['outsider']);
    requiredQueue = [{ type: 'outsider', label: 'Outsider' }];
    offenseJsonSteps.forEach(step => {
      stepToolLabels(step).forEach(label => {
        const key = slugType(label);
        if (!seenTypes.has(key)) { seenTypes.add(key); requiredQueue.push(buildNodeDef(label)); }
      });
    });

    // Defense-only tools: unique defense tools not already required by offense, plus the
    // fixed 'defterm' Security Response Center hub the defense engine pivots on.
    NEW_DEFENSE_TOOLS = [];
    defenseJsonSteps.forEach(step => {
      stepToolLabels(step).forEach(label => {
        const key = slugType(label);
        if (!seenTypes.has(key)) { seenTypes.add(key); NEW_DEFENSE_TOOLS.push(buildNodeDef(label)); }
      });
    });
    NEW_DEFENSE_TOOLS.push({ type: 'defterm', label: 'Security Response Center' });

    NODE_ORDER = requiredQueue.concat(NEW_DEFENSE_TOOLS).map(t => t.type);

    // TOOL_DEFS only needs entries for nodes that actually get spawned on stage
    TOOL_DEFS = {};
    requiredQueue.concat(NEW_DEFENSE_TOOLS).forEach(t => {
      if (t.type === 'outsider') { TOOL_DEFS.outsider = { emoji: '🕵️', name: 'Outsider', w: 17, h: 12.6 }; return; }
      if (t.type === 'defterm') { TOOL_DEFS.defterm = { emoji: '🛡️', name: 'Security Response Center', w: 10.6, h: 9.6 }; return; }
      TOOL_DEFS[t.type] = { emoji: pickEmoji(t.label), name: t.label, w: 10, h: 9 };
    });

    // 4) Toolbox pool: every tool/device/actor named in the JSON (decoys included), plus
    // anything actually required that the JSON's tools[] list happened to omit.
    const poolSeen = new Set();
    TOOLBOX_ICONS = [];
    (lab.tools || []).forEach(label => {
      const key = slugType(label);
      if (poolSeen.has(key)) return;
      poolSeen.add(key);
      TOOLBOX_ICONS.push({ type: key, label: label, icon: pickIcon(label) });
    });
    requiredQueue.concat(NEW_DEFENSE_TOOLS).forEach(t => {
      if (poolSeen.has(t.type)) return;
      poolSeen.add(t.type);
      TOOLBOX_ICONS.push({ type: t.type, label: t.label, icon: t.type === 'defterm' ? 'fas fa-terminal' : pickIcon(t.label) });
    });

    // 6/7) OFFENSE_STEPS / DEFENSE_STEPS — command, cmd info, activity log, dashboard text.
    // Each JSON step names every device it touches via `tools` (array) — a combined
    // command can animate 2+ devices simultaneously on execution.
    OFFENSE_STEPS = offenseJsonSteps.map(step => {
      const labels = stepToolLabels(step);
      return {
        title: step.action,
        subtopic: step.technique,
        actorLabel: step.actor,
        tool: slugType(labels[0] || ''),
        toolLabel: labels[0] || '',
        tools: labels.map(slugType),
        toolLabels: labels,
        type: 'command',
        command: step.command,
        explain: step['command info'],
        activityLog: step['activity log'],
        dashboard: step.dashboard,
        resultLines: [step.dashboard]
      };
    });
    DEFENSE_STEPS = defenseJsonSteps.map(step => {
      const labels = stepToolLabels(step);
      return {
        title: step.action,
        subtopic: step.technique,
        actorLabel: step.actor,
        tool: slugType(labels[0] || ''),
        toolLabel: labels[0] || '',
        tools: labels.map(slugType),
        toolLabels: labels,
        type: 'command',
        command: step.command,
        explain: step['command info'],
        activityLog: step['activity log'],
        dashboard: step.dashboard,
        resultLines: [step.dashboard]
      };
    });

    TOTAL_OFFENSE_STAGES = OFFENSE_STEPS.length || 1;
    TOTAL_DEFENSE_STAGES = DEFENSE_STEPS.length || 1;

    OFFENSE_COMPLETION_TEXT = buildCompletionListHTML((lab.offense && lab.offense.completion) || [], false);
    DEFENSE_COMPLETION_TEXT = buildCompletionListHTML((lab.defense && lab.defense.completion) || [], true);

    // 8) Cyber Test quiz — MCQs, matching pairs, short-answer questions
    const cyberTest = lab.cyberTest || {};
    quizMCQs = (cyberTest.mcqs || []).map(item => ({
      q: item.q,
      options: Object.assign({}, item.options),
      answer: item.answer
    }));
    shuffleQuizOptions();

    const matchingPairs = cyberTest.matching || [];
    const matchLetters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    quizMatchingA = matchingPairs.map(p => p.term);
    quizMatchingB = {};
    quizMatchingAnswer = matchingPairs.map((p, i) => matchLetters[i]);
    matchingPairs.forEach((p, i) => { quizMatchingB[matchLetters[i]] = p.definition; });

    quizShortQuestions = (cyberTest.shortQuestions || []).slice();
    quizTotalPoints = quizMCQs.length + quizMatchingA.length;
  }

  function showLabLoadError(message) {
    document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div style="font-size:15px; font-weight:800; margin-bottom:10px;">⚠️ Couldn't load the lab</div>
        <div style="font-size:12.5px; line-height:1.6; white-space:pre-wrap;">${escapeHtmlText(message)}</div>
        <div style="margin-top:16px; text-align:right;">
          <button id="labLoadErrBackBtn" class="wk-lab-btn" style="padding:8px 16px;">Back to Week/Lab picker</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#labLoadErrBackBtn').addEventListener('click', () => { overlay.remove(); showWkLabModal(); });
  }

  function loadLabActivity(labId) {
    loadLabData().then(data => {
      const lab = (data || []).find(l => l.id === labId);
      if (!lab) {
        console.error('Lab not found in ' + LAB_JSON_PATH + ': ' + labId);
        showLabLoadError(`"${labId}" was not found in ${LAB_JSON_PATH}.\n\nMake sure that JSON file has an entry with "id": "${labId}".`);
        return;
      }
      resetAll();
      applyLabData(lab);
      renderToolbox();
      updateToolboxPrompt();
      showScenarioModal(function() {});
    }).catch(err => {
      console.error('Failed to load lab data', err);
      showLabLoadError((err && err.message) ? err.message : String(err));
    });
  }

  // ---- Week/Lab picker modal (shown on load; also reopenable via the "Choose Lab" button) ----
  const TOTAL_WEEKS = 9;
  const LABS_PER_WEEK = 3;

  function showWkLabModal() {
    document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'wkLabModal';

    let cardsHtml = '';
    for (let w = 1; w <= TOTAL_WEEKS; w++) {
      let backButtonsHtml = '';
      for (let l = 1; l <= LABS_PER_WEEK; l++) {
        const labId = `WK-${w}-L${l}`;
        backButtonsHtml += `<button type="button" class="wk-lab-btn" data-lab-id="${labId}">${labId}</button>`;
      }
      cardsHtml += `
        <div class="flip-card" data-week="${w}">
          <div class="flip-card-inner">
            <div class="flip-card-front">
<p class="title" style="font-size:22px; margin-bottom:1%; color:grey; line-height:1.0;margin-top:30px;">
    WEEK<br>${w}
</p>
            </div>
            <div class="flip-card-back">${backButtonsHtml}</div>
          </div>
        </div>`;
    }

    overlay.innerHTML = `
      <div class="modal-box wk-lab-modal-box">
        
        <div class="wk-week-grid">${cardsHtml}</div>
      </div>`;
    document.body.appendChild(overlay);

    // Tap-to-flip support for touch devices (hover already flips on desktop via CSS).
    overlay.querySelectorAll('.flip-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.wk-lab-btn')) return;
        card.classList.toggle('wk-flipped');
      });
    });

    overlay.querySelectorAll('.wk-lab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const labId = btn.dataset.labId;
        overlay.remove();
        loadLabActivity(labId);
      });
    });
  }

  const changeLabBtn = document.getElementById('changeLabBtn');
  if (changeLabBtn) changeLabBtn.addEventListener('click', showWkLabModal);

  // ---- INIT ----
  initThree();
  renderToolbox();
  updateToolboxPrompt();
  prepareWaitingState();
  showWkLabModal();
})();
</script>
<script>
// Prevent Save As
document.addEventListener('keydown', function (e) {

    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }

});

// Disable right-click menu on the main page
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
});

</script>
</body>
