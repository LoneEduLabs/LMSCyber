iv class="prog"><i id="prog"></i></div> </div> <div class="panel"> <h3>Phase 1 timeline</h3> <div class="tl"> <div><b>Week 7</b><span>4–8 Oct: problem analysis and Gantt chart</span></div> <div><b>Week 8</b><span>11–15 Oct: data collection, cleaning and analysis</span></div> <div class="last"><b>Week 9</b><span>18–22 Oct: dashboard, presentation. <strong>Submission deadline Thu 22 Oct.</strong></span></div> </div> </div> </aside> <main class="main"> <section class="step" data-step="0"> <div class="shead"><div><div class="k">Step 1 of 5</div><h2>Student information</h2><p>Enter your details in English letters so they appear correctly on your PDF.</p></div></div> <div class="alert" id="a0"></div> <div class="card"> <h4>Student details</h4><p class="hint">Use English letters so your details appear correctly on the PDF.</p> <div class="grid g3"> <div class="f"><label for="s_name">Student Name <em>*</em></label><input class="in" id="s_name" data-k="name" placeholder="e.g. Omar Al-Harbi" maxlength="60"></div> <div class="f"><label for="s_sid">SID <em>*</em></label><input class="in" id="s_sid" data-k="sid" placeholder="Student ID" maxlength="20"></div> <div class="f"><label for="s_sec">Grade <em>*</em></label><input class="in" id="s_sec" data-k="section" placeholder="e.g. G11-D" maxlength="20"></div> </div> </div> <div class="card"> <h4>Phase 1 at a glance</h4><p class="hint">This planner covers Phase 1 of the project only.</p> <div class="fixed"> <div class="fact"><span>Phase</span><b>Phase 1 (Quarter 1)</b></div> <div class="fact"><span>Starts</span><b>Week 7, Sun 4 Oct</b></div> <div class="fact warn"><span>Submission deadline</span><b>Week 9, Thu 22 Oct</b></div> <div class="fact amb"><span>Marks</span><b>Planning 6 | Designing 4</b></div> </div> </div> <div class="navs"><span></span><button class="btn pri" data-next>Continue to project →</button></div> </section> <section class="step" data-step="1"> <div class="shead"><div><div class="k">Step 2 of 5</div><h2>Project selection</h2><p>Find your course and choose your project.</p></div></div> <div class="alert" id="a1"></div> <div class="card"> <h4>Choose your project</h4><p class="hint">Find your course and choose your project. Choosing a project in one list clears the other lists.</p> <div class="courses" id="coursesA"></div> <div class="selbar" id="selBarA"></div> <div class="proj" id="projCard"></div> </div> <div class="card"> <h4>How Phase 1 is marked (10 marks)</h4><p class="hint">Plan your work so every component is covered by Week 9.</p> <div class="marks"> <div><b>2</b>Project planning: problem, objectives, Gantt chart</div> <div><b>2</b>Data collection: organized, cleaned dataset</div> <div><b>2</b>Data analysis: patterns and trends</div> <div><b>2</b>Data visualization: interactive dashboard</div> <div><b>2</b>Presentation and live demonstration</div> </div> </div> <div class="navs"><button class="btn gh" data-prev>← Back</button><button class="btn pri" data-next>Continue to objectives →</button></div> </section> <section class="step" data-step="2"> <div class="shead"><div><div class="k">Step 3 of 5</div><h2>Problem, objectives and real-life use</h2><p>Explain what your project will find out, why it matters and who will use it. Suggestions for your chosen project appear under each box.</p></div></div> <div class="alert" id="a2"></div> <div class="guidehead" id="guideHead"></div> <div class="card"> <h4>The problem</h4><p class="hint">Start from the driving question, then describe the problem in your own words.</p> <div class="grid"> <div class="f"><label for="q_drive">Driving question <em>*</em></label><input class="in" id="q_drive" data-k="driving" maxlength="220"></div> <div class="f"><label for="q_prob">Problem statement <em>*</em></label><textarea class="in" id="q_prob" data-k="problem" maxlength="700" placeholder="What does the organization record but not analyze? What decision is difficult for them right now?"></textarea></div> </div> </div> <div class="card"> <h4>Project objectives</h4><p class="hint">Write three objectives. Begin each with an action verb, and link them to the standards below.</p> <div class="std"><span>2.1 Identify data sources</span><span>2.2 Collect and organize data</span><span>2.3 Analyze patterns and trends</span><span>2.4 Visualize with dashboards</span></div> <div class="grid"> <div class="objrow f"><span>1</span><input class="in" id="o1" data-k="obj1" maxlength="200" placeholder="e.g. Collect and organize … data using Microsoft Forms and Excel"></div> <div class="objrow f"><span>2</span><input class="in" id="o2" data-k="obj2" maxlength="200" placeholder="e.g. Analyze the data to find …"></div> <div class="objrow f"><span>3</span><input class="in" id="o3" data-k="obj3" maxlength="200" placeholder="e.g. Build an interactive dashboard that shows …"></div> </div> </div> <div class="card"> <h4>Real-life use</h4><p class="hint">Who is your client, and how will your dashboard help them make better decisions?</p> <div class="grid g2"> <div class="f"><label for="q_aud">Client / audience <em>*</em></label><input class="in" id="q_aud" data-k="audience" maxlength="120"></div> <div class="f"><label for="q_ben">Who benefits? <em>*</em></label><input class="in" id="q_ben" data-k="benefit" maxlength="160" placeholder="e.g. students, staff, customers, managers"></div> </div> <div class="f" style="margin-top:14px"><label for="q_use">How will your findings be used in real life? <em>*</em></label><textarea class="in" id="q_use" data-k="realUse" maxlength="700" placeholder="Describe the decisions your dashboard will support and what could improve."></textarea></div> </div> <div class="card"> <h4>Data plan and tools</h4><p class="hint">Confirm what you will collect and how.</p> <div class="f"><label for="q_data">Data to collect <em>*</em></label><input class="in" id="q_data" data-k="dataCollect" maxlength="240"></div> <div class="f" style="margin-top:14px"><label>Collection methods <em>*</em></label><div class="checks" id
